        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: scaffold-routes-dedupe
    type: deterministic
    description: "v81+v115: disambiguate duplicate route ids — route()/index() sharing a component, same-file OR cross-file (RR7 'duplicate route id')"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-routes-dedupe.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  # v122: reconcile role-group route PREFIXES with story ui_routes (RCA #5).
  # convert-wire-routes wraps role groups in PATHLESS layout(), so adminRoutes/
  # companyRoutes mount at root (/companies, /staff) while stories use /admin/* +
  # /company/* → every authenticated admin/company story navigates to a 404. The
  # doctor converts layout(RoleLayout, routes) → route('<prefix>', RoleLayout,
  # routes) for any role whose STORIES use a /<role> prefix (worker stays pathless
  # — its stories use root paths). Evidence-driven + idempotent. Runs after dedupe,
  # before prune/build. v121: lifted live story pass 19%→45% (next blocker: missing
  # auth-bootstrap, not routing).
  - id: scaffold-route-prefix-doctor
    type: deterministic
    description: "v122: prefix role route groups (/admin, /company) to match story ui_routes — RCA #5 (404 on authenticated routes)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-route-prefix-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --stories-dir "{TARGET_DIR}/{PROJECT_DIR}/user_stories" \
        --verbose
    on_failure: ignore

  # v122: auth-bootstrap (RCA #5b). The SPA must hydrate the redux auth slice from
  # the httpOnly session cookie on load — without it the slice stays unauthenticated
  # and EVERY protected route redirects (v121: /admin → / with zero /api calls; no
  # /auth/me|checkAuth anywhere). Generates AuthBootstrap (GET /auth/me on mount →
  # dispatch the slice's authenticate action), wires it inside the redux Provider,
  # AND fixes the role guards: (a) string role-names → numeric (backend role is a
  # NUMBER — operator=10), (b) adds an isLoading gate so a guard never redirects
  # mid-hydration (the v121 race: AdminGuard rendered with user=null → Navigate('/')
  # before the bootstrap populated it). Live: 5/6 protected routes render, 45%→62%.
  - id: scaffold-auth-bootstrap
    type: deterministic
    description: "v122: hydrate auth from /auth/me on load + numeric-role/isLoading guard fix — RCA #5b (protected routes redirect)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-auth-bootstrap.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  # v82: prune route() entries whose component .tsx file doesn't exist.
  # v81 evidence: worker cell test-browser CRASHED in 5.8s because routes.ts
  # referenced `affiliationRequest/layout.tsx` (kebab/camel mismatch — actual
  # dir is `affiliation-request/`). vite refused to boot with ENOENT, blocking
  # the entire test-browser phase for that cell. This runs AFTER routes-dedupe
  # and ALL page scaffolds.
  - id: scaffold-routes-prune
    type: deterministic
    description: "v82: prune route() entries whose .tsx file doesn't exist (prevents vite ENOENT crash)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-routes-prune.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  # v77: codemod — scan app/pages/**/*.tsx + app/components/**/*.tsx, find
  # JSX identifiers like `<Input>` / `<Button>` / `useAuth()` that aren't
  # imported, and prepend the missing imports based on the actual catalog
  # of exports under app/components/ui|atoms|layouts|shared, app/hooks,
  # app/lib, app/contexts. v76 evidence: 17 occurrences of
  # `TS2304: Cannot find name 'Input'` across UserEditPage.tsx — pure
  # missing-import bug from the LLM converter.
  - id: scaffold-page-imports-doctor
    type: deterministic
    description: "v77: prepend missing UI/hook/service imports detected from JSX/identifier use"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-page-imports-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v88: Replace hallucinated lucide-react icon names (CashCheck, OfficeBuilding,
  # AccountGroup, FileDocumentCheck, FileChart, etc.) with valid substitutes.
  # Uses `<sub> as <hallucinated>` aliases so JSX code (`<CashCheck />`) keeps
  # working without rewrites. v87 evidence: 6 LLM-converted admin pages had
  # bogus lucide imports → TS2305 → Vite bundle failure → admin 0/28 stories.
  # Runs BEFORE broken-imports-quarantine so it fixes recoverable cases first
  # (quarantine is the nuclear option for pages with too many bad imports).
  # v108: Fix WorkerGuard/CompanyGuard/AdminGuard `if (isLoading)` spinner loop.
  # LLM-generated role guards check `isLoading` unconditionally. If a guarded page
  # dispatches me() on mount (e.g. profile page), isLoading cycles true→false→true
  # every render, causing the guard to unmount/remount the page infinitely.
  # Fix: change `if (isLoading)` → `if (!authChecked && isLoading)` so spinner only
  # shows during initial auth check. Evidence: v107 13-my-profile AC-3+AC-5 failing.
  - id: scaffold-auth-guard-isloading-doctor
    type: deterministic
    description: "v108: fix role guards to use !authChecked && isLoading (prevent infinite spinner on page-dispatched me())"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-auth-guard-isloading-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-lucide-icon-doctor
    type: deterministic
    description: "v88: substitute hallucinated lucide-react icon names with valid ones via as-alias"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-lucide-icon-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  # v88: QUARANTINE pages whose imports can't be resolved. page-imports-doctor
  # (above) handles ADDITIVE fixes (missing imports for JSX identifiers); this
  # handles UNRESOLVABLE imports (hallucinated lucide-react icon names like
  # `CashCheck`/`OfficeBuilding`, missing module paths). Vite uses static
  # imports — ONE bad page kills the WHOLE SPA bundle (returns 500 on every
  # route). Quarantine replaces the page source with a tiny safety-net stub
  # that preserves the file path + default export name so routes still resolve.
  #
  # v87 evidence: admin cell 0/28 stories because 6 LLM-converted pages had
  # bogus `import { CashCheck, OfficeBuilding, ... } from 'lucide-react'`.
  # company cell 6/6 PASS in the same run because its routes didn't statically
  # import the broken pages. routes-prune handles MISSING files; this handles
  # files that EXIST but can't resolve their imports.
  - id: scaffold-broken-imports-quarantine
    type: deterministic
    description: "v88: replace pages with >=3 unresolvable imports with safety-net stubs (prevents Vite bundle poisoning)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-broken-imports-quarantine.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: merge-convert-reports
    type: deterministic
    description: "Aggregate per-page convert reports into FRONTEND_CONVERSION_REPORT.md"
    command: |
      set -e
      STATUS_DIR="{TARGET_DIR}/{STATUS_DIR}"
      OUT="$STATUS_DIR/FRONTEND_CONVERSION_REPORT.md"
      PARTIALS=$(ls "$STATUS_DIR"/FRONTEND_CONVERT_*.md 2>/dev/null | sort || true)
      SHELL="$STATUS_DIR/FRONTEND_SHELL_REPORT.md"
      ROUTES="$STATUS_DIR/FRONTEND_ROUTES_WIRED.md"
      if [ -z "$PARTIALS" ]; then
        echo "FAIL: no per-page convert reports found in $STATUS_DIR"
        exit 1
      fi
      PAGES=0
      TOTAL_BUTTONS=0
      TOTAL_FORMS=0
      TOTAL_TESTIDS=0
      FIDELITY_SUM=0
      for f in $PARTIALS; do
        PAGES=$((PAGES + 1))
        B=$(grep -E '^buttons_matched:'   "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        FM=$(grep -E '^form_fields_matched:' "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        T=$(grep -E '^testids_added:'     "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        FI=$(grep -E '^fidelity_estimate:' "$f" | grep -oE '[0-9]+\.?[0-9]*' | head -1 || echo 0)
        TOTAL_BUTTONS=$((TOTAL_BUTTONS + B))
        TOTAL_FORMS=$((TOTAL_FORMS + FM))
        TOTAL_TESTIDS=$((TOTAL_TESTIDS + T))
        FIDELITY_SUM=$(awk -v a="$FIDELITY_SUM" -v b="$FI" 'BEGIN { print a + b }')
      done
      AVG_FIDELITY=$(awk -v s="$FIDELITY_SUM" -v n="$PAGES" 'BEGIN { if (n > 0) printf "%.3f", s / n; else print "0" }')
      LAYOUTS=0
      [ -f "$SHELL" ] && LAYOUTS=$(grep -E '^layouts_created:' "$SHELL" | grep -oE '[0-9]+' | head -1 || echo 0)
      ROUTES_WIRED=0
      [ -f "$ROUTES" ] && ROUTES_WIRED=$(grep -E '^routes_wired:' "$ROUTES" | grep -oE '[0-9]+' | head -1 || echo 0)
      HTML_SOURCE_COUNT=$(find "{TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}" -name '*.html' 2>/dev/null | wc -l | tr -d ' ' || echo 0)
      {
        echo "# Frontend Conversion Report"
        echo ""
        echo "phase: frontend-convert"
        echo "html_source_files: $HTML_SOURCE_COUNT"
        echo "pages_converted: $PAGES"
        echo "layouts_created: $LAYOUTS"
        echo "routes_wired: $ROUTES_WIRED"
        echo "fidelity_estimate: $AVG_FIDELITY"
        echo "buttons_matched: $TOTAL_BUTTONS"
        echo "form_fields_matched: $TOTAL_FORMS"
        echo "testids_added: $TOTAL_TESTIDS"
        echo "i18n_configured: true"
        echo ""
        echo "## Shell report"
        echo ""
        if [ -f "$SHELL" ]; then cat "$SHELL"; else echo "(missing)"; fi
        echo ""
        echo "## Routes wired"
        echo ""
        if [ -f "$ROUTES" ]; then cat "$ROUTES"; else echo "(missing)"; fi
        echo ""
        echo "## Per-page reports"
        echo ""
        for f in $PARTIALS; do
          echo "### $(basename $f)"
          echo ""
          cat "$f"
          echo ""
        done
      } > "$OUT"
      echo "aggregated $PAGES page reports -> $OUT"
    on_failure: abort
    abort_message: "Cannot aggregate per-page convert reports. Check that convert-pages cells produced their FRONTEND_CONVERT_<page>.md files."

  - id: design-fidelity-check
    type: agentic
    timeout_ms: 2400000   # 40min — multi-page screenshot diff + scoring across all converted pages
    description: "Execute design-qa-html skill: per-screen fidelity scoring (gen 1 target: 85%, ratchets each generation)"
    on_failure: ignore
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_FIDELITY_REPORT.md"
    # Verification accepts >= 0.70 — the SCORE itself is enforced by frontend-gate
    # which uses progressive thresholds (gen 1: 0.70, gen 2: 0.85, gen 3+: 0.95).
    # This prevents a single phase blowout when 59 auto-converted pages can't
    # hit 95% in one pass within reasonable budget.
    verification_pattern: "avg_fidelity:\\s*0\\.[7-9]\\d*|avg_fidelity:\\s*1\\.0+"
    scope_guard:
      allow: ["{FRONTEND_DIR}/app/**"]
      deny: ["{BACKEND_DIR}/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/design/DESIGN_SYSTEM.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/generated-screens/*.html"
        - "{TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}/*.html"
        - ".claude/{FRONTEND}/skills/qa/design-qa-html.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      Execute the design-qa-html skill (.claude/{FRONTEND}/skills/qa/design-qa-html.md)
      end-to-end. Follow ALL 7 phases of the skill — do not shortcut.

      ## Required workflow (from the skill)

      Phase 1 — Project Selection
        - Discover frontend dir ({FRONTEND_DIR}/) and load
          {STATUS_DIR}/SCREEN_IMPLEMENTATION_STATUS.md
          (if absent, derive screen list from HTML inventory).

      Phase 2 — Screen Selection
        - Run on ALL screens (full project QA). Do not sample.

      Phase 3 — HTML Prototype Analysis
        For each HTML file under {PROJECT_DIR}/generated-screens/ or
        {PROJECT_DIR}/design/html/:
          - Read the file fully
          - Extract & categorize Tailwind classes into 6 buckets:
            Layout / Spacing / Typography / Colors / Visual Effects / Components
          - Build the class inventory table

      Phase 4 — Implementation Review
        For each matching React file under {FRONTEND_DIR}/app/pages/:
          - Read the file
          - Extract & categorize classes using the SAME 6 buckets

      Phase 5 — Fidelity Score Calculation (MANDATORY weights)
        Category Score = (matching_classes / total_html_classes_in_category) * 100
        Apply weights:
          Layout         25%
          Spacing        20%
          Typography     20%
          Colors         15%
          Visual Effects 10%
          Components     10%
        Overall = sum(score * weight)

      Phase 6 — Fix Generation + Repair Loop (BUDGET-BOUNDED)
        - Identify the LOWEST-SCORING 5 pages (by overall fidelity).
        - For each of those 5 pages only:
            * Generate Critical+High priority fixes (skip Medium/Low)
            * APPLY the fixes via Edit/MultiEdit on {FRONTEND_DIR}/app/pages/**
            * Re-measure that page
        - Limit: 1 fix iteration per page (NOT 3). Future generations will iterate further.
        - All other pages: report scores in the table, no edits.
        - RULE-F8 still applies: use [Xpx] arbitrary values when HTML uses
          non-standard pixel values.

      Phase 7 — Report Generation

        CRITICAL — write the report in EXACTLY the format below. Do NOT
        rephrase, do NOT use markdown bold for the metric lines, do NOT
        embed metrics in narrative paragraphs. The artifact-verification
        regex looks for `avg_fidelity:\s*0\.[7-9]\d*|avg_fidelity:\s*1\.0+`
        as a literal line — `**avg_fidelity:** 0.85` or "achieved 85%
        fidelity" will FAIL.

        Copy-paste this template and fill in the numbers:

        ```
        # FRONTEND_FIDELITY_REPORT

        phase: frontend-fidelity
        pages_checked: <int>
        avg_fidelity: <float, must be >= 0.95>
        category_scores:
          layout: <float>
          spacing: <float>
          typography: <float>
          colors: <float>
          effects: <float>
          components: <float>
        pages_below_95: [list of page names still under 0.95 after 3 iters]
        pages_fixed: <int>
        fix_iterations: <int total fixes applied across all pages>

        ## Per-screen table
        | screen | fidelity | rating | notes |
        |---|---|---|---|
        | ... | ... | ... | ... |

        ## Project-wide rating distribution
        Pixel Perfect: <int> | Minor Issues: <int> | Needs Work: <int> | Major Revision: <int>
        ```

        v94 evidence: agent wrote markdown bullets like "**avg_fidelity:** 0.51"
        instead of bare key-value → regex failed → pattern_mismatch failure.

        Also include a per-screen table and the project-wide rating
        distribution (Pixel Perfect / Minor Issues / Needs Work / Major
        Revision) as shown in the skill.

      ## Hard requirements
      - avg_fidelity target is >= 0.85. Do NOT over-iterate — report the actual score achieved.
      - Do NOT inflate scores. Use the formula in Phase 5 strictly.
      - Do NOT touch {BACKEND_DIR}/** or design files — only {FRONTEND_DIR}/app/**.

  # ============================================================================
  # TIER 3: POST-CHECKS (deterministic)
  # ============================================================================

  - id: fidelity-gate
    type: deterministic
    description: "Enforce avg_fidelity threshold (progressive: gen 1 >= 0.70, gen 2 >= 0.85, gen 3+ >= 0.95)"
    command: |
      REPORT="{TARGET_DIR}/{STATUS_DIR}/FRONTEND_FIDELITY_REPORT.md"
      STATUS_FILE="{TARGET_DIR}/{STATUS_DIR}/PIPELINE_STATUS.md"
      if [ ! -f "$REPORT" ]; then
        echo "WARN: FRONTEND_FIDELITY_REPORT.md missing — skipping fidelity gate (design-fidelity-check may have failed)"
        exit 0
      fi
      SCORE=$(grep -E '^avg_fidelity:' "$REPORT" | head -1 | sed -E 's/.*: *([0-9.]+).*/\1/')
      [ -n "$SCORE" ] || { echo "WARN: avg_fidelity field not found in report — skip"; exit 0; }
      GEN=1
      if [ -f "$STATUS_FILE" ]; then
        PARSED=$(grep -m1 '^generation:' "$STATUS_FILE" | sed 's/[^0-9]//g')
        GEN=${PARSED:-1}
      fi
      if [ "$GEN" -ge 3 ]; then THRESHOLD=0.95
      elif [ "$GEN" -eq 2 ]; then THRESHOLD=0.85
      else THRESHOLD=0.70
      fi
      awk -v s="$SCORE" -v t="$THRESHOLD" 'BEGIN { exit (s+0 >= t+0 ? 0 : 1) }' || {
        echo "FAIL: avg_fidelity=$SCORE < $THRESHOLD (gen $GEN)"; exit 1;
      }
      echo "PASS: avg_fidelity=$SCORE >= $THRESHOLD (gen $GEN)"
    on_failure: abort
    abort_message: "Frontend fidelity below progressive threshold — see FRONTEND_FIDELITY_REPORT.md"

  - id: lint-fix
    type: deterministic
    description: "Auto-fix ESLint issues"
    command: |
      cd "{TARGET_DIR}/{FRONTEND_DIR}" && npx eslint app/ --fix 2>&1 || true
    on_failure: ignore

  # v65: fix common LLM-import mistakes before typecheck runs. v64 evidence:
  # react-router-dom (v6 path) used instead of react-router; FormField etc.
  # used in JSX without imports; UUID type without import. Each is a clear
  # pattern we can fix deterministically.
  - id: normalize-frontend-imports
    type: deterministic
    description: "Rewrite known-bad import patterns (react-router-dom→react-router, add missing Form* imports)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/normalize-frontend-imports.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v67: regenerate rootReducer.ts to import + combine EVERY *Slice.ts file
  # found under app/redux/features/. Fixes v66 cascade: LLM wrote slices
  # individually but forgot to wire them into the store, causing TS2339
  # in guards and pages doing useAppSelector((s) => s.<missingSlice>).
  - id: scaffold-redux-store
    type: deterministic
    description: "Regenerate rootReducer.ts to wire every *Slice.ts (prevents missing-slice TS2339)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-redux-store.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v132: strip extraReducers .addCase(X.pending|fulfilled|rejected) where X is a
  # PLAIN mutation function, not a createAsyncThunk. X.pending is then `undefined`
  # → addCase(undefined) throws at STORE CREATION → the app white-screens on
  # hydration → every interactive story on that store fails (a build-clean RUNTIME
  # crash that build/typecheck miss). v132 live evidence: userSlice addCase'd
  # `createUser` (a plain async mutation). Conservative + re-export-aware: strips
  # ONLY positively-plain refs; keeps thunks (incl. re-exported) and anything
  # unresolvable. Runs right after redux-store wires the slices.
  - id: scaffold-redux-thunk-guard
    type: deterministic
    description: "v132: remove extraReducers addCase blocks referencing non-thunk (plain mutation) exports — prevents store-creation crash"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-redux-thunk-guard.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  # v78: emit a Vitest+RTL smoke test per scaffolded page (renders without
  # crashing + key data-testids present). Requires scaffold-frontend-test-config
  # to have set up vitest + deps.
  - id: scaffold-component-tests
    type: deterministic
    description: "v78: emit Vitest+RTL smoke test per scaffolded page"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-component-tests.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v78: emit Vitest test per Redux slice (reducer + thunk lifecycle).
  - id: scaffold-store-tests
    type: deterministic
    description: "v78: emit Vitest test per *Slice.ts (reducer + thunk pending/fulfilled/rejected)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-store-tests.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v67: extract all `t('namespace.key', 'default')` calls from scaffolded
  # TSX/TS files, merge missing keys into app/i18n/locales/<lang>/<ns>.json,
  # update i18n/index.ts to import all namespaces × locales. Fixes the
  # v50-v54 pattern of pages rendering raw key strings because locale JSON
  # was missing the keys.
  - id: scaffold-i18n-keys
    type: deterministic
    description: "Extract t() calls and merge missing keys into locale JSON files; update i18n/index.ts"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-i18n-keys.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --default-locale "${DEFAULT_LOCALE:-ko}"
    on_failure: ignore

  # v82: ensure every declared frontend dep is installed before vite tries
  # to boot. v79+v80 evidence: @vitejs/plugin-react, msw, etc. declared in
  # devDependencies via scaffolds but absent from node_modules → vitest +
  # vite both blow up.
  - id: scaffold-ensure-deps-installed
    type: deterministic
    description: "v82: npm install if any package.json dep is missing from node_modules"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-ensure-deps-installed.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v130: re-run the lucide doctor AFTER deps are installed. The early pass (in
  # the doctor block above) reads node_modules/lucide-react's .d.ts to build the
  # authoritative icon catalog — but deps aren't installed until THIS point, so
  # the early pass SKIPS ("lucide-react types not found") and every hallucinated
  # icon (e.g. `ClipboardText`, a Phosphor name) survives to `build`, where rollup
  # hard-fails with MISSING_EXPORT (tsc misses it). v130 evidence: 38 bad icons
  # across 9 pages reached build → frontend hard-gate abort at node 71/74. This
  # final pass has the catalog and aliases each bad name to a valid icon. Doctor-
  # ordering rule: a catalog/deps-dependent doctor must run after deps install.
  - id: scaffold-lucide-icon-doctor-final
    type: deterministic
    description: "v130: re-run lucide icon doctor after deps install (early pass skipped — no node_modules yet → bad icons reach build)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-lucide-icon-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: ensure-rr7-types
    type: deterministic
    description: "Run react-router typegen; on failure, write stub +types/root.ts so tsc doesn't TS2307"
    # v67: split out the typegen step + add stub fallback. Pairs with the
    # scope_guard lockdown of vite.config.ts/tsconfig.json/react-router.config.ts
    # in convert-pages. The stub keeps tsc happy even if typegen crashes
    # (RCA-from-v66: typegen failures dropped 35min on fix-agent recovery).
    command: |
      node {CLAUDE_DIR}/v2/scripts/ensure-rr7-types.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v90: DISABLED v91 — see backend-2.yaml comment. False-positive rate too
  # high. Brace-balance parser breaks on template literals + JSX expressions.
  # - id: scaffold-truncated-llm-doctor (disabled v91)

  # v118: repair the frontend contract-drift cascade BEFORE typecheck. Once
  # db/backend fixes first let a slim run reach the frontend build, v118 surfaced
  # 36 tsc errors in 3 LLM page/service/type disagreement classes (role string↔
  # number, auth shape, crud page↔service names). This doctor fixes all of them
  # deterministically (verified: 36 → 0 on the v118 snapshot, full `npm run build`
  # passes). Runs LAST before typecheck so the route_to_agent fix-agent — which
  # went off-track on 36 errors in v118 — faces 0, not a wall.
  - id: scaffold-frontend-contract-doctor
    type: deterministic
    description: "v118: fix frontend contract-drift (role string↔number, auth shape, crud page↔service/type names) before typecheck"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-frontend-contract-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --project-database "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_DATABASE.md" \
        --verbose
    on_failure: ignore

  - id: typecheck
    type: deterministic
    description: "Verify frontend TypeScript compiles"
    command: |
      cd "{TARGET_DIR}/{FRONTEND_DIR}" && npx tsc --noEmit 2>&1
    # v65: route_to_agent so fix-agent patches typecheck errors instead of
    # cold-aborting. Universal safety net for residual LLM-output bugs
    # not caught by normalize-frontend-imports.
    on_failure: route_to_agent
    abort_message: "Frontend TypeScript does not compile"

  # v104: restore scaffold-protected files (api-client-types, service-from-
  # controller) that fix-agent may have edited during typecheck repair.
  # Per template_wins_LLM — scaffold contracts > LLM-fixed contracts.
  # v128: second stray sweep — the fidelity fix + typecheck fix-agent run after
  # the first sweep and can stray-write just like convert-pages did (same
  # absolute-prefix anchoring hazard). Idempotent; no-op when no stray root.
  - id: scaffold-stray-output-relocate-final
    type: deterministic
    description: "v128: relocate any late LLM stray writes under {PROJECT_DIR}/{FRONTEND_DIR}/ before restore/enforce"
    on_failure: ignore
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-stray-output-doctor.js \
        --target "{TARGET_DIR}" \
        --frontend-dir "{FRONTEND_DIR}" \
        --verbose

  - id: scaffold-restorer
    type: deterministic
    description: "v104: restore scaffold-protected frontend files that fix-agent may have edited"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-restorer.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --phase frontend \
        --backend-dir "{TARGET_DIR}/{BACKEND_DIR}" \
        --claude-dir "{CLAUDE_DIR}" \
        --verbose
    on_failure: ignore

  # v128: enforcement half of the deterministic-primary contract. The convert-pages
  # prompt says "keep testids / default export / data wiring", but a prompt is an
  # LLM-promise, not a guarantee ([[feedback_template_wins_llm]]). This restores
  # the snapshotted deterministic page for any file whose contract was broken by
  # ANY LLM node (convert-pages, fidelity fix, typecheck fix-agent). Runs after
  # the last LLM mutation per [[feedback_doctor_ordering]], BEFORE routes-final-
  # cleanup so the final prune sees restored files and keeps their routes.
  # Restored files compile by construction — safe after typecheck.
  - id: scaffold-scope-lock-enforce
    type: deterministic
    description: "v128: restore deterministic pages whose contract (testids/default export) was broken by LLM nodes"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-scope-lock-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --enforce \
        --verbose
    on_failure: ignore

  # v123: FINAL route-config cleanup, immediately before build. routes-dedupe (node
  # 42) + routes-prune (45) run early, but the typecheck FIX-AGENT (62) and
  # scaffold-restorer (63) run AFTER them and can reintroduce a duplicate route id or
  # a dangling .tsx ref → build hard-aborts ("Unable to define routes with duplicate
  # route id"). v123 died exactly here. Re-running prune (deterministic ids → re-run
  # safe) then dedupe (disambiguates any duplicate component path / id) right before
  # build guarantees the routes.ts that reaches build is clean, whatever the late
  # nodes did. Idempotent — no-op if already clean.
  - id: scaffold-routes-final-cleanup
    type: deterministic
    description: "v123: final routes prune+dedupe before build (catches dup route ids reintroduced by fix-agent/restorer)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-routes-prune.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" || true
      node {CLAUDE_DIR}/v2/scripts/scaffold-routes-dedupe.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v131: PROACTIVE build preflight. Run the full idempotent build-blocker doctor
  # sweep immediately before the gate — AFTER the late nodes (restorer/scope-lock/
  # routes-final-cleanup) that can REINTRODUCE a bad icon or dangling import after
  # the early doctors already ran. Catches deterministic blockers on the FIRST
  # build attempt (no wasted retry). Shares the exact sweep with the self-heal node.
  - id: frontend-build-preflight
    type: deterministic
    description: "v131: run the full build-blocker doctor sweep right before build (catches late-reintroduced blockers proactively)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-frontend-build-preflight.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --default-locale "${DEFAULT_LOCALE:-ko}"
    on_failure: ignore

  # v131: SELF-HEALING build gate. A hard-gate abort here throws away the whole
  # ~3h run (backend + frontend generation). But ~every build failure we've seen
  # is DETERMINISTIC and already fixable by an existing doctor — they just ran too
  # early (lucide before deps) or had a completeness gap (i18n locale matrix). So
  # before aborting: run the full idempotent build-blocker doctor sweep (the SAME
  # preflight script) and RETRY the build ONCE. Only a SECOND failure is a genuine
  # (non-deterministic) hard-abort. v130 evidence: i18n UNRESOLVED_IMPORT + lucide
  # MISSING_EXPORT each wasted a full 3h run; this self-heals both in ~30s. A hard
  # gate should mean "no doctor can fix this", not "a locale file was missing".
  # See [[feedback_self_healing_hard_gates]].
  - id: build
    type: deterministic
    description: "v131: self-healing production build — on failure, run build-blocker doctor sweep + retry once before aborting"
    command: |
      FE="{TARGET_DIR}/{FRONTEND_DIR}"
      cd "$FE"
      # v132: surface the ERROR HEAD, not just `tail` — rollup/esbuild dump a huge
      # `files:`/`watchFiles:` array on failure that pushes the real message out of
      # any tail window (this hid the v132 "already declared" dup-import error).
      show_err() { echo "$1" | grep -iE "error|could not resolve|not exported|has already been declared|already declared|Expected .* but found|Transform failed|RollupError|cannot find|duplicate route" | head -15; echo "  …"; echo "$1" | tail -8; }
      OUT=$(npm run build 2>&1); RC=$?
      if [ "$RC" -eq 0 ]; then echo "$OUT" | tail -8; exit 0; fi
      show_err "$OUT"
      echo "──────────────────────────────────────────────────────────────"
      echo "build FAILED (rc=$RC) — self-heal: running build-blocker doctors + retry once"
      echo "──────────────────────────────────────────────────────────────"
      # Error-directed hint (log which class the rollup error points at).
      echo "$OUT" | grep -qiE "UNRESOLVED_IMPORT|Could not resolve .*locales" && echo "  → signal: i18n locale incompleteness"
      echo "$OUT" | grep -qiE "MISSING_EXPORT|not exported by.*lucide" && echo "  → signal: hallucinated lucide icon"
      echo "$OUT" | grep -qiE "has already been declared|already declared" && echo "  → signal: duplicate import (i18n/index.ts or page)"
      echo "$OUT" | grep -qiE "duplicate route id" && echo "  → signal: duplicate route id"
      echo "$OUT" | grep -qiE "Could not resolve .*~/|Could not resolve .*\./" && echo "  → signal: dangling/broken import"
      # Same idempotent sweep used proactively above (DRY).
      node "{CLAUDE_DIR}/v2/scripts/scaffold-frontend-build-preflight.js" \
        --target "$FE" --default-locale "${DEFAULT_LOCALE:-ko}" 2>&1 | tail -12 || true
      echo "── retry build ──"
      OUT2=$(npm run build 2>&1); RC2=$?
      if [ "$RC2" -eq 0 ]; then
        echo "✅ self-heal SUCCEEDED — build green after doctor sweep (saved a full-run abort)"
      else
        echo "❌ self-heal did NOT fix it — genuine build failure (no doctor covers this class). Error head:"
        show_err "$OUT2"
      fi
      exit "$RC2"
    on_failure: abort
    abort_message: "Frontend production build failed AFTER self-heal doctor sweep + retry — genuine (non-deterministic) build error"

  - id: evidence-check
    type: deterministic
    description: "Verify page components + HTML coverage >= 80%"
    command: |
      FE="{TARGET_DIR}/{FRONTEND_DIR}"
      # v55 fix: check both app/ (RR7) and src/ (legacy) — same dual-path
      # treatment as integrate-2.yaml pre-check.
      PAGES_APP=$(find "$FE/app" -name '*.tsx' \( -path '*/pages/*' -o -path '*/views/*' -o -path '*/routes/*' \) 2>/dev/null | wc -l | tr -d ' ')
      PAGES_SRC=$(find "$FE/src" -name '*.tsx' \( -path '*/pages/*' -o -path '*/views/*' \) 2>/dev/null | wc -l | tr -d ' ')
      PAGES=$((PAGES_APP + PAGES_SRC))
      [ "$PAGES" -gt 0 ] || { echo "FAIL: no page TSX files in {FRONTEND_DIR} (checked app/ and src/)"; exit 1; }
      HTML=$(find {TARGET_DIR}/{PROJECT_DIR}/generated-screens {TARGET_DIR}/{PROJECT_DIR}/design/html -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
      if [ "$HTML" -gt 0 ]; then
        THRESHOLD=$((HTML * 80 / 100))
        [ "$THRESHOLD" -lt 1 ] && THRESHOLD=1
        [ "$PAGES" -lt "$THRESHOLD" ] && { echo "FAIL: $PAGES pages < $THRESHOLD (80% of $HTML HTML)"; exit 1; }
        echo "PASS: $PAGES pages cover $HTML HTML (>= 80%)"
      else
        echo "PASS: $PAGES pages (no HTML to compare)"
      fi
    on_failure: abort

  - id: cross-reference-consistency
    type: deterministic
    description: "Drift check — HTML/i18n/services consistency (advisory)"
    command: |
      bash "{CLAUDE_DIR}/gates/cross-reference-consistency.sh" "{TARGET_DIR}" "{project}" \
        | tee "{TARGET_DIR}/{STATUS_DIR}/CONSISTENCY_REPORT_FRONTEND.json"
      exit 0
    on_failure: ignore

  # ============================================================================
  # TIER 4: LLM EVALUATOR (article §2 — separate generator from evaluator)
  # ============================================================================
  #
  # Independent grading of the converted React. Crucial here because
  # design-fidelity-check above is itself an LLM that scores its own work
  # — a self-evaluation bias risk the article specifically warns against.
  # The evaluator runs in a fresh subprocess with a read-only tool profile,
  # grading on fidelity / token-discipline / componentization / completeness.
  #
  # on_failure: ignore — a broken evaluator must not prevent shipping. The
  # absence of a score shows up in reward.js as no drift signal.

  - id: frontend-evaluator
    type: evaluator
    description: "Grade React conversion against HTML source + DESIGN_SYSTEM tokens"
    rubric_file: ".claude/blueprints/evaluators/frontend-rubric.yaml"
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/frontend-evaluation.json"
    verification_pattern: '"overall_score"\s*:\s*[0-9.]+'
    tool_profile:
      allow: [Read, Grep, Glob, Bash, Write]
      # Edit / NotebookEdit / WebFetch / WebSearch are force-denied by
      # lib/evaluator.js even if listed here. Redeclaring for clarity.
      deny: [Edit, NotebookEdit, WebFetch, WebSearch]
    inputs:
      artifacts:
        - "{TARGET_DIR}/{FRONTEND_DIR}/app/pages/**/*.tsx"
        - "{TARGET_DIR}/{FRONTEND_DIR}/app/components/**/*.tsx"
        # routes file path varies (routes.ts / routes.tsx / app/routes.ts).
        # Match anywhere under src to be tolerant.
        - "{TARGET_DIR}/{FRONTEND_DIR}/app/**/routes.ts"
        - "{TARGET_DIR}/{FRONTEND_DIR}/app/**/routes.tsx"
        - "{TARGET_DIR}/{FRONTEND_DIR}/app/root.tsx"
      references:
        - "{TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}/*.html"
        - "{TARGET_DIR}/{PROJECT_DIR}/design/DESIGN_SYSTEM.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_PRD_ROLES.md"
      max_files: 30
      max_chars_per_file: 8000
    blend:
      strategy: soft_score
      deterministic_weight: 0.6
      weight: 0.4
      min_evaluator_score: 0.5
    calibration:
      examples_file: ".claude/blueprints/evaluators/frontend-examples.yaml"
    on_failure: ignore

tool_profile:
  allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
  deny: [WebSearch]
