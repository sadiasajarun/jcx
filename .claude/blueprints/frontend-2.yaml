      node {CLAUDE_DIR}/v2/scripts/normalize-routes.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v86 Lever 1: SAFETY-NET deterministic page generator from user_story
  # YAMLs. For every story that has no corresponding page (because LLM
  # convert-pages failed/skipped/timed-out), emit a minimal-but-testable
  # stub: fetch on mount, render section per AC with data-testid matching
  # story spec selectors, action buttons for mutation endpoints, loading/
  # error/empty states. Also emits routes/safety-net.routes.ts so
