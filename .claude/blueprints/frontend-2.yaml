name: frontend-2
description: |
  Convert HTML designs to React components.
  v2 blueprint with strict artifact contracts on every agentic node.
version: 2
manifest: frontend

nodes:
  # ============================================================================
  # TIER 1: PRE-FLIGHT (deterministic)
  # ============================================================================

  - id: design-approval-check
    type: deterministic
    description: "Block frontend if design not approved + fully complete"
    command: |
      STATUS_FILE=""
      for c in \
        "{TARGET_DIR}/{STATUS_DIR}/DESIGN_STATUS.md" \
        "{TARGET_DIR}/{STATUS_DIR}/DESIGN_STATUS.md" \
        "{TARGET_DIR}/{PROJECT_DIR}/design/DESIGN_STATUS.md"; do
        [ -f "$c" ] && STATUS_FILE="$c" && break
      done
      [ -n "$STATUS_FILE" ] || { echo "FAIL: DESIGN_STATUS.md missing"; exit 1; }
      grep -q 'approved: true' "$STATUS_FILE" || { echo "FAIL: design not approved"; exit 1; }
      grep -q 'phase_complete: true' "$STATUS_FILE" || { echo "FAIL: design phase_complete missing"; exit 1; }
      VARIATION=$(grep 'selected_variation:' "$STATUS_FILE" | sed 's/.*: *//' | tr -d ' "')
      echo "Design approved: variation ${VARIATION}"
    on_failure: abort
    abort_message: "Phase 3 (design) must be approved AND phase_complete before frontend"

  - id: html-inventory
    type: deterministic
    description: "List HTML prototypes to convert"
    command: |
      HTML_DIR=""
      for d in {PROJECT_DIR}/generated-screens {PROJECT_DIR}/design/html design/html; do
        if [ -d "{TARGET_DIR}/$d" ] && [ "$(find "{TARGET_DIR}/$d" -name '*.html' 2>/dev/null | wc -l)" -gt 0 ]; then
          HTML_DIR="{TARGET_DIR}/$d"
          break
        fi
      done
      [ -n "$HTML_DIR" ] || { echo "FAIL: no HTML prototypes"; exit 1; }
      COUNT=$(find "$HTML_DIR" -name '*.html' | wc -l | tr -d ' ')
      echo "HTML_DIR=$HTML_DIR"
      echo "HTML_COUNT=$COUNT"
    on_failure: abort

  - id: extract-prd-roles
    type: deterministic
    description: "Extract PRD role/layout references into PROJECT_PRD_ROLES.md"
    command: |
      PRD="{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
      OUT="{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_PRD_ROLES.md"
      [ -f "$PRD" ] || { echo "PROJECT_KNOWLEDGE.md missing — skipping"; exit 0; }
      mkdir -p "$(dirname "$OUT")"
      {
        echo "# PRD Role & Layout Requirements (Auto-generated)"
        echo ""
        echo "## User Roles"
        grep -iE 'admin|user|client|manager|super.admin|owner|viewer|editor|moderator|staff|role' "$PRD" | \
          grep -iv 'database\|column\|entity\|migration\|typeorm\|prisma' | head -30
        echo ""
        echo "## Layout Requirements"
        grep -iE 'layout|sidebar|navbar|header|footer|navigation' "$PRD" | head -20
        echo ""
        echo "## Route Guards"
        grep -iE 'guard|protect|auth.*route|role.*based|access.*control|permission' "$PRD" | head -20
      } > "$OUT"
      echo "Extracted to $OUT"
    on_failure: ignore

  - id: scaffold-frontend-shell
    type: deterministic
    description: "Copy canonical React framework templates (app/, configs) from {CLAUDE_DIR}/{FRONTEND}/templates/ — single source of truth, no LLM invention"
    command: |
      set -e
      SRC_DIR="{CLAUDE_DIR}/{FRONTEND}/templates"
      DST_DIR="{TARGET_DIR}/{FRONTEND_DIR}"

      [ -d "$SRC_DIR/app" ] || { echo "FAIL: template app/ missing: $SRC_DIR/app"; exit 1; }
      mkdir -p "$DST_DIR"

      # Copy app/ tree recursively (idempotent — never overwrite existing files)
      copy_tree() {
        local src="$1" dst="$2"
        [ -d "$src" ] || return 0
        mkdir -p "$dst"
        local copied=0 skipped=0
        for entry in "$src"/* "$src"/.[!.]*; do
          [ -e "$entry" ] || continue
          local name=$(basename "$entry")
          local target="$dst/$name"
          if [ -d "$entry" ]; then
            copy_tree "$entry" "$target"
          elif [ -f "$entry" ]; then
            if [ -f "$target" ]; then
              skipped=$((skipped+1))
            else
              cp "$entry" "$target"
              copied=$((copied+1))
            fi
          fi
        done
        [ $((copied+skipped)) -gt 0 ] && echo "  $(basename "$src"): copied=$copied skipped=$skipped"
        return 0
      }

      echo "Scaffolding frontend from $SRC_DIR"
      copy_tree "$SRC_DIR/app" "$DST_DIR/app"

      # Root configs (only if absent)
      for f in components.json react-router.config.ts tsconfig.json vite.config.ts package.json Dockerfile .dockerignore .gitignore .env.example; do
        if [ -f "$SRC_DIR/$f" ] && [ ! -f "$DST_DIR/$f" ]; then
          cp "$SRC_DIR/$f" "$DST_DIR/$f"
          echo "  copied $f"
        fi
      done

      # Sanity: critical primitives must exist after this node
      for f in app/lib/utils.ts app/services/httpService.ts app/redux/store/store.ts app/redux/store/hooks.ts app/root.tsx app/routes.ts; do
        [ -f "$DST_DIR/$f" ] || { echo "FAIL: $f missing after scaffold"; exit 1; }
      done

      # Ensure node_modules has the RR7 deps that the templates require.
      # v25-resume evidence: init-2.yaml's package.json template is RR6-shaped,
      # but scaffold-frontend-shell copies an RR7 vite.config.ts that imports
      # `@react-router/dev/vite`. If convert-shell (which updates package.json)
      # times out or fails, the resulting node_modules is stale and typecheck
      # / build later in the phase ABORTs with "tsc not installed" or
      # "Cannot find package '@react-router/dev'". Running npm install here
      # is idempotent: fast no-op when up-to-date, populates missing deps
      # otherwise. Always runs because npm install itself is the cache check.
      if [ -f "$DST_DIR/package.json" ]; then
        cd "$DST_DIR"
        if [ ! -d node_modules ] || [ ! -d node_modules/@react-router/dev ]; then
          echo "Installing $DST_DIR deps (idempotent)"
          npm install --legacy-peer-deps --no-audit --no-fund --silent 2>&1 | tail -5
        else
          echo "$DST_DIR/node_modules looks current — skip install"
        fi
      fi

      echo "PASS: Frontend shell scaffolded from templates"
    on_failure: abort
    abort_message: "Failed to scaffold frontend from {CLAUDE_DIR}/{FRONTEND}/templates — verify templates exist (PR #56 in claude-react)"

  # v78: derive frontend/.env.example from `import.meta.env.VITE_*` greps.
  - id: scaffold-environment
    type: deterministic
    description: "v78: derive frontend .env.example from import.meta.env.* references"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-environment.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --side frontend
    on_failure: ignore

  # v78: write canonical AdminLayout / UserLayout / GuestLayout (RULE-F3).
  - id: scaffold-layouts
    type: deterministic
    description: "v78: write canonical Admin/User/Guest layouts (RULE-F3 role coverage)"
    command: |
      ARGS="--target {TARGET_DIR}/{FRONTEND_DIR} --templates {CLAUDE_DIR}/{FRONTEND}/templates/components/layouts"
      PLAN="{TARGET_DIR}/{STATUS_DIR}/PAGES_PLAN{FRONTEND_NAME_SUFFIX}.yaml"
      [ -f "$PLAN" ] && ARGS="$ARGS --pages-plan $PLAN"
      node {CLAUDE_DIR}/v2/scripts/scaffold-layouts.js $ARGS
    on_failure: ignore

  # v78: ship a reusable DataTable component every list page can consume
  # instead of reinventing sort/pagination/empty/loading.
  - id: scaffold-data-table
    type: deterministic
    description: "v78: write reusable DataTable.tsx with sort/pagination/empty/loading/error"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-data-table.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --templates "{CLAUDE_DIR}/{FRONTEND}/templates/components/data-table"
    on_failure: ignore

  # v78: write vitest config + RTL + MSW setup files + add 7 devDeps + 2
  # npm scripts. Prerequisite for scaffold-component-tests + scaffold-store-tests.
  - id: scaffold-frontend-test-config
    type: deterministic
    description: "v78: write vitest config + RTL/MSW setup, register devDeps + npm scripts"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-frontend-test-config.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --templates "{CLAUDE_DIR}/{FRONTEND}/templates/tests"
    on_failure: ignore

  # v78 Tier 2 — common app primitives the LLM keeps reinventing badly.
  # Each is project-agnostic and idempotent (marker-based skip on
  # hand-authored files). Pull-through cost = ~50ms per node.

  - id: scaffold-toast-system
    type: deterministic
    description: "v78 Tier 2: ship Sonner toaster + typed lib/toast.ts facade + register sonner dep"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-toast-system.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-modal-manager
    type: deterministic
    description: "v78 Tier 2: ship useDisclosure + programmatic useConfirm + ConfirmProvider + ConfirmModal"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-modal-manager.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-protected-route-guard
    type: deterministic
    description: "v78 Tier 2: ship AuthGuard / GuestGuard / RoleGuard / ProtectedLayout (canonical RR7 + Redux auth)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-protected-route-guard.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-language-toggle
    type: deterministic
    description: "v78 Tier 2: ship LanguageToggle dropdown (detects available i18n locales)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-language-toggle.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-search-filter-bar
    type: deterministic
    description: "v78 Tier 2: ship useDebouncedValue + useUrlState + SearchInput + FilterChips"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-search-filter-bar.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  # v78 Tier 4 — heavy single-file components LLM keeps reinventing. Each
  # ships one wrapper around a popular library and registers its dep.

  - id: scaffold-rich-text-editor
    type: deterministic
    description: "v78 Tier 4: RichTextEditor (Tiptap + StarterKit + toolbar)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-rich-text-editor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-file-upload-dropzone
    type: deterministic
    description: "v78 Tier 4: FileDropzone (react-dropzone)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-file-upload-dropzone.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-date-picker
    type: deterministic
    description: "v78 Tier 4: DatePicker (react-day-picker + date-fns + Popover)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-date-picker.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-charts-library
    type: deterministic
    description: "v78 Tier 4: BarChart / LineChart / PieChart (Recharts wrappers)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-charts-library.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}"
    on_failure: ignore

  - id: scaffold-pwa-manifest
    type: deterministic
    description: "v78 Tier 4: manifest.webmanifest + sw.js + patch <head> link in root.tsx"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-pwa-manifest.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --knowledge "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
    on_failure: ignore

  # ============================================================================
  # TIER 2: AGENTIC NODES WITH ARTIFACT CONTRACTS
  # ============================================================================

  - id: convert-shell
    type: agentic
    # v91: model-agnostic routing via intent + cost_class.
    # Was hardcoded `backend: claude` — top 429 offender on mimo (5 hits
    # across v76-v85b) because it's a one-shot heavy synthesis node.
    # Now: declares the WORK shape; cell config maps shape → backend via
    #   AGENT_BACKEND_synthesis=<model>  or
    #   AGENT_BACKEND_heavy=<model>
    intent: synthesis
    cost_class: heavy
    # v90: bumped 80 → 150. v89 evidence: convert-shell hit MAX_TURNS=80
    # (node-declared: 80) — synthesis of full React shell (i18n + routes
    # + ProtectedRoute + layouts + deps) needs more turns than initially
    # estimated. 150 gives headroom without burning whole budget.
    max_turns: 150
    description: "Cross-cutting React scaffolding — i18n, ProtectedRoute, routes.ts, layouts, deps, tsconfig"
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_SHELL_REPORT.md"
    verification_pattern: "shell_status:\\s*ready"
    scope_guard:
      allow: ["{FRONTEND_DIR}/app/**", "{FRONTEND_DIR}/public/**", "{FRONTEND_DIR}/package.json", "{FRONTEND_DIR}/tsconfig.json"]
      deny: ["{BACKEND_DIR}/**", "{PROJECT_DIR}/design/**", "{FRONTEND_DIR}/app/pages/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_PRD_ROLES.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}/*.html"
        - ".claude/{FRONTEND}/guides/best-practices.md"
        - ".claude/{FRONTEND}/guides/routing-guide.md"
        - ".claude/{FRONTEND}/guides/styling-guide.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    # v83: changed from default-abort to ignore. v80-v82 evidence: when
    # convert-shell fails (mimo MAX_TURNS, missing artifact, etc.), the
    # frontend phase ABORTED — taking ALL 38 downstream scaffolds with it
    # (routes-prune, routes-dedupe, page-imports-doctor, form-from-entity,
    # service-from-controller, api-client-types, etc.). Result: every fix
    # I committed to those scaffolds did NOT execute on the worker cell,
    # which is exactly why "duplicate route id" + ENOENT crashes recurred
    # across 3 runs despite the fixes being in place.
    # Downstream scaffolds are mostly deterministic + idempotent — they
    # can recover from partial convert-shell output. The worst case is
    # missing FRONTEND_SHELL_REPORT.md, which downstream nodes handle
    # gracefully via existsSync checks.
    on_failure: ignore
    prompt: |
      Build the project-specific React scaffolding on top of the canonical
      framework templates that scaffold-frontend-shell already copied in.

      PRE-INSTALLED FRAMEWORK FILES (READ-ONLY — DO NOT MODIFY OR RECREATE):
      The scaffold-frontend-shell node has already copied these from
      {CLAUDE_DIR}/{FRONTEND}/templates/. They are the single source of truth —
      import from them, do not redefine them:
        - {FRONTEND_DIR}/package.json + tsconfig.json + vite.config.ts +
          react-router.config.ts + components.json + Dockerfile + .env.example
        - {FRONTEND_DIR}/app/root.tsx (RR7 root layout + ErrorBoundary)
        - {FRONTEND_DIR}/app/routes.ts (top-level route aggregator)
        - {FRONTEND_DIR}/app/lib/utils.ts (cn helper)
        - {FRONTEND_DIR}/app/services/httpService.ts (axios orchestrator)
        - {FRONTEND_DIR}/app/redux/store/{store,hooks,rootReducer}.ts
        - {FRONTEND_DIR}/app/components/ui/* (shadcn primitives — button, card, form, input, label)
        - {FRONTEND_DIR}/app/hooks/providers/providers.tsx (Redux Provider wrapper)
        - {FRONTEND_DIR}/app/styles/{app,typography}.css
        - {FRONTEND_DIR}/app/utils/{errorHandler.ts, validations/, actions/}
      Treat all of the above as immutable. If a primitive looks "wrong" — it is
      not. Adapt your code to it. To evolve a primitive, send a PR to
      potentialInc/claude-react templates/.

      DELIVERABLES (this node ONLY — these are the gaps the templates do not fill):
      1. {FRONTEND_DIR}/app/i18n/index.ts — calls `i18next.use(initReactI18next).init({...})`.
      2. {FRONTEND_DIR}/public/locales/en/common.json AND ko/common.json (plus any
         additional locales declared in PROJECT_KNOWLEDGE.md / PRD).
      3. {FRONTEND_DIR}/app/components/guards/{AuthGuard,GuestGuard,RoleGuard}.tsx —
         role-aware route guards (see .claude/{FRONTEND}/guides/auth-guards.md).
      4. {FRONTEND_DIR}/app/components/layouts/*.tsx — one Layout per role declared in
         PROJECT_PRD_ROLES.md (e.g. AdminLayout, ClientLayout, MinimalLayout).
         Each Layout's logo/brand element MUST be wrapped in a `<Link to="/...">` and
         contain the word "Brand", "Logo", or "Name" so the gate grep detects it.
         The starter template already provides {FRONTEND_DIR}/app/pages/layout.tsx
         and {FRONTEND_DIR}/app/pages/auth/layout.tsx — extend those patterns; do
         not delete the starter layouts.
      5. Update {FRONTEND_DIR}/app/routes.ts to register guards + role layouts,
         add a `route('*', 'pages/not-found.tsx')` catch-all, and import any
         additional `*.routes.ts` files you create under app/routes/.
      6. A language toggle (EN/KO etc.) in the shared header
         ({FRONTEND_DIR}/app/components/layout/header.tsx already exists; modify
         it to add the toggle — it is project-specific UI, not a framework primitive).
      7. If main.tsx is needed (RR7 framework mode usually does not require one),
         create it minimally and import the i18n init.

      DO NOT:
      - Re-create or edit ANY pre-installed framework file listed above.
      - Create per-page components under {FRONTEND_DIR}/app/pages/ — that is the
        exclusive domain of convert-pages cells.
      - Reinvent httpService, redux store, cn(), ui/ primitives — they exist.

      RULE-F8 reminder for any inline markup you write (Layouts especially):
        - Extract EXACT CSS values from referenced HTML — `padding: 40px 36px → px-[36px] py-[40px]`
        - Preserve box-shadow, backdrop-filter

      REPORT FILE: {STATUS_DIR}/FRONTEND_SHELL_REPORT.md
      Required fields (regex-verifiable):
        phase: frontend-shell
        shell_status: ready
        layouts_created: <int>
        locales_configured: <int>
        protected_route_added: true
        catchall_404_added: true
        ts_strict: true
        deps_installed: <int>

  # ============================================================================
  # v62 — CRUD PAGE SCAFFOLDING (deterministic, replaces LLM CRUD page work)
  # ============================================================================
  #
  # Flow:
  #   1. emit-pages-plan (agentic) reads PROJECT_API.md + PROJECT_KNOWLEDGE.md
  #      + design HTML and emits PAGES_PLAN.yaml listing every CRUD page-set.
  #   2. scaffold-crud-pages (deterministic) expands the _crud/ template tree
  #      per CRUD entry — List + Detail + Create + Edit + service + slice +
  #      types + route shim.
  #   3. convert-pages (existing agentic, below) now writes ONLY:
  #      - Non-CRUD pages (dashboards, wizards, file upload, custom flows)
  #      - Per-page customization on top of CRUD scaffolds (extra filters, etc.)
  #
  # If PAGES_PLAN.yaml is missing/empty, scaffold-crud-pages no-ops; convert
  # writes everything as before.

  - id: emit-pages-plan
    type: agentic
    timeout_ms: 1200000   # 20min — structured emit
    # v91: model-agnostic. Was hardcoded `backend: claude` due to 2 mimo
    # 429 hits — one-shot structured emission. Declares intent/cost so
    # cell config can route to any backend.
    intent: structured_emit
    cost_class: heavy
    # v90: bumped 60 → 120. Was too tight in v89 (hit ~80 turns analyzing pages).
    max_turns: 120
    description: "Emit PAGES_PLAN.yaml listing per-frontend CRUD page-sets"
    # v83: prevent cascade-abort. ensure-pages-plan (deterministic) is the
    # fallback that fills PAGES_PLAN from MODULE_PLAN if emit-pages-plan
    # fails. Without on_failure: ignore, every downstream scaffold dies
    # if emit-pages-plan hits MAX_TURNS.
    on_failure: ignore
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/PAGES_PLAN{FRONTEND_NAME_SUFFIX}.yaml"
    verification_pattern: "modules:"
    scope_guard:
      allow: ["{STATUS_DIR}/PAGES_PLAN{FRONTEND_NAME_SUFFIX}.yaml"]
      deny: ["{FRONTEND_DIR}/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
        - "{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
        - ".claude/{FRONTEND}/templates/modules/_crud/PAGES_PLAN.example.yaml"
    tool_profile:
      allow: [Read, Write, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch, Edit, MultiEdit]
    prompt: |
      Emit `{STATUS_DIR}/PAGES_PLAN{FRONTEND_NAME_SUFFIX}.yaml` — the input
      `scaffold-crud-pages` consumes to generate CRUD page-sets for the
      current frontend ({FRONTEND_DIR}).

      EXAMPLE: Read `.claude/{FRONTEND}/templates/modules/_crud/PAGES_PLAN.example.yaml`
      first. Strict schema, kebab-case names.

      EXTRACTION RULES:
      1. The backend MODULE_PLAN.yaml is the AUTHORITATIVE source of fields.
         For each CRUD module belonging to THIS frontend, COPY the field
         list verbatim from MODULE_PLAN (same `name`, same `type`, same
         enum values). The only allowed modifications:
           - REMOVE sensitive fields (password, internal tokens) entirely
             from `fields:` (don't keep them with `form: false`)
           - ADD `list:` / `form:` per-field flags to control table column
             and form inclusion
           - ADD `label:` for display strings
         The PAGES_PLAN field SHAPE must be a SUBSET of MODULE_PLAN. Skipping
         a non-nullable field from MODULE_PLAN will cause typecheck failures
         downstream because the backend's Create DTO will require it
         (v62-att2 evidence: Notice.body was in MODULE_PLAN but missing
         from PAGES_PLAN → TS2345 "Property 'body' is missing").
      2. emit a PAGES_PLAN entry only for CRUD modules whose pages belong to
         THIS frontend. Each frontend (worker / admin-dashboard /
         company-dashboard) sees different subsets — match by:
           - HTML pages under {TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}/
           - The `role_required` value the user-facing portal serves
      3. Field `type` values must match MODULE_PLAN's TS types. For enum
         fields, copy `enumValues: [...]` from MODULE_PLAN (the generator
         renders these as a Select dropdown, not a text Input).
      4. Per field: `list: true/false` decides table column inclusion,
         `form: true/false` decides if it's in Create/Edit forms.
         (v70) Add `sortable: true|false` to mark a column as sort-clickable
         (defaults to true). Enums + ID fields typically `sortable: false`.

      4b. VALIDATORS (v70) — per field `validators:` accepts these tokens.
          IMPORTANT: when a token contains `:` or `/`, WRAP IT IN DOUBLE
          QUOTES so YAML doesn't parse it as a key or break on slashes.
          Examples: `"minLength:8"`, `"pattern:^010-\\d{4}-\\d{4}$"`.
          Plain tokens (`required`, `email`, `optional`) need no quoting.
          Each emits a zod method + user-facing error message in the form:
            required               (default for non-optional strings)
            optional               → field becomes optional
            email                  → .email('Please enter a valid email')
            url, uuid              → corresponding zod methods
            minLength:N            → .min(N, 'Must be at least N characters')
            maxLength:N            → .max(N, 'Must be at most N characters')
            min:N  (number fields) → .min(N, 'Must be ≥ N')
            max:N  (number fields) → .max(N, 'Must be ≤ N')
            pattern:/regex/flags   → .regex(/.../, 'Field has invalid format')
          Extract from PRD constraint text ("1-100 characters" → minLength:1, maxLength:100;
          "must be Korean phone format" → pattern:/^010-\d{4}-\d{4}$/).
          Missing validators = forms still work but lose user-friendly errors.

      5. `detail_relations:` lists joined data shown on the Detail page.
         (v70) Two relation types are scaffolded; declare them via `type:`:
           - type: ref       → belongs-to. Renders inline as a single
                                <dt>/<dd>. Optional `displayField: name`
                                shows that property of the related entity.
           - type: has_many  → one-to-many. Renders a separate section
                                BELOW the <dl> with a nested <table> per
                                relation. Declare `columns: [a, b, c]` to
                                pick which related properties to show.
                                Defaults to [id] when omitted.
         Example:
           detail_relations:
             - field: organization
               type: ref
               displayField: name
             - field: applications
               type: has_many
               columns: [id, serviceType, status, createdAt]
         Use has_many for any "this entity owns N of those" view — common
         on user-detail (their applications), application-detail (its
         documents), etc.
      6. `role_required:` must match the frontend's allowed role (extract
         from PROJECT_KNOWLEDGE.md user types section).

      6b. LIST_FEATURES (v70+) — opt-in dashboard-management controls on the
          List page. Pick from [search, sort, pagination] per module:
            list_features: [search, sort, pagination]
          - `search`     → adds an `<Input type="search">` bound to ?search=
                           in the URL; backend is expected to accept the
                           param (BaseController already supports it).
          - `sort`       → makes column headers per `sortable: true` field
                           clickable, toggles asc ↔ desc on ?sort=.
          - `pagination` → adds Prev/Next nav bound to ?page=.
          Omit `list_features:` (or set `[]`) for legacy plain-table pages.
          ADD this to modules whose list pages have a noticeable row count
          (>20 typical) or where the HTML prototype shows search/filter
          controls. Skip for short lookup tables.

      7. AUTH_PAGES (v67+) — if this frontend handles login/signup, add:
           auth_pages:
             login: true
             signup: true|false
             forgot_password: true|false
             verify_email: true|false
         Cross-references MODULE_PLAN.auth.identifier_field + signup_fields.
         OMIT auth_pages: entirely for frontends that don't authenticate
         (e.g. anonymous public site).

      8. WORKFLOW_PAGES (v67+) — for each MODULE_PLAN.workflows[] entry whose
         entity has pages on this frontend, add:
           workflow_pages:
             - workflow: <matches MODULE_PLAN.workflows[].name>
               list_columns: [id, ..., currentState, updatedAt]
               transition_buttons: [<all transition.action names>]
               role_required: <role>
         Generator builds list-grouped-by-state + detail-with-buttons.

      9. UPLOAD_PAGES (v67+) — for each MODULE_PLAN.uploads[] entry, add:
           upload_pages:
             - upload: <matches MODULE_PLAN.uploads[].name>
               list: true|false
               upload_form: true|false
               role_required: <role>
         Backend mime/size limits are inherited from MODULE_PLAN.

      10. DASHBOARDS (v67+) — if the design HTML or PRD specifies a stats/
         summary page, add dashboards: with cards + charts using the DSL:
           dashboards:
             - name: <kebab>
               route: '/admin'
               role_required: admin
               cards:
                 - title: "..."
                   query: 'count:<entity-plural>,where:<field><op><val>'
               charts:
                 - title: "..."
                   type: pie|line|bar
                   query: 'count:<entity>,group:<field>[,window:Nd]'
         DSL operators: =, !=, >, <, >=, <=, LIKE, IN. Time tokens: today().

      DO NOT:
      - Include pages for modules whose role doesn't match this frontend
      - Use snake_case for `name`
      - Emit pages for non-CRUD modules (those stay in convert-pages)
      - Drop a non-nullable field from MODULE_PLAN (Create DTO will reject)
      - Duplicate auth/workflow/upload modules under both modules: AND
        the dedicated section — pick ONE (the dedicated section if the
        scaffolder exists for it).

  # v72: derive PAGES_PLAN from MODULE_PLAN as a fallback if emit-pages-plan
  # failed (mimo 429, watchdog timeout, etc.). v71 evidence: admin-dashboard
  # cell's emit-pages-plan failed → all scaffolds skipped → 0/10 stories
  # passed. With this fallback the same failure mode produces a working
  # scaffold output instead.
  #
  # If PAGES_PLAN already exists AND has real content (a modules: block or
  # non_crud_modules: or dashboards: section), the script keeps the LLM's
  # output untouched. Only fires when the LLM phase legitimately failed.
  - id: ensure-pages-plan
    type: deterministic
    description: "v72: derive PAGES_PLAN from MODULE_PLAN if emit-pages-plan failed (fallback for 429/watchdog)"
    command: |
      MODULE_PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      PAGES_PLAN="{TARGET_DIR}/{STATUS_DIR}/PAGES_PLAN{FRONTEND_NAME_SUFFIX}.yaml"
      [ -f "$MODULE_PLAN" ] || { echo "no MODULE_PLAN — skipping fallback"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/ensure-pages-plan.js \
        --module-plan "$MODULE_PLAN" \
        --pages-plan-out "$PAGES_PLAN" \
        --verbose
    on_failure: ignore

