    on_failure: ignore

  # v81: dedupe route() entries pointing to the same component file.
  # v80 evidence: worker cell test-browser crashed in 5.6s at ensure-servers
  # because auth.routes.ts had:
  #   route("signup", "pages/auth/register.tsx"),
  #   route("register", "pages/auth/register.tsx"),
  # RR7 uses the component path as the implicit route id; duplicates make
  # vite refuse to boot with `Unable to define routes with duplicate route id`.
  # LLM convert-pages introduced the alias; this normalizer strips it.
  # v115: strip unresolvable bare-package CSS @imports (tw-animate-css) that break
  # the Tailwind-v4 vite production build. A DOCTOR (not just a template edit)
