  # v127 (option A): standardize convert-pages' CONTRACT layer. Enumerate every importable
  # module + named export the upstream contract scaffolds actually produced, into
  # IMPORT_MANIFEST.md. convert-pages is then told to import ONLY from it — killing the
  # dominant build-break class (LLM invents ~/services/~/types/~/enums imports that don't
  # exist → TS2307 / "not exported by"). Runs after ALL contract scaffolds, before convert.
  - id: scaffold-import-manifest
    type: deterministic
    description: "v127: enumerate importable modules+exports → IMPORT_MANIFEST.md (pins convert-pages' import contract to reality)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-import-manifest.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --out "{TARGET_DIR}/{FRONTEND_DIR}/IMPORT_MANIFEST.md"
    on_failure: ignore

  # ============================================================================
  # v128: DETERMINISTIC-PRIMARY page generation ([[feedback_template_wins_llm]]).
  # v123-v127 evidence: the main frontend builds every run but each secondary
  # breaks differently — an unbounded tail of convert-pages (LLM) defects that
  # no amount of doctors can enumerate. Inversion: scaffold-page-from-story
  # (the v86 safety net) is PROMOTED to the primary path — every story gets a
  # deterministic page BEFORE convert-pages runs (compiles by construction,
  # story-spec data-testids, right API calls). convert-pages is DEMOTED to
  # visual enhancement in place, scope-locked: scaffold-scope-lock-doctor
  # snapshots the deterministic pages here and restores any page whose contract
  # (testids / default export) an LLM node breaks (enforce node before build).
  # LLM timeout/garbage now costs visuals, never the build or the story floor.
  # ============================================================================
  - id: scaffold-page-from-story-primary
    type: deterministic
    description: "v128: PRIMARY deterministic pages for every story BEFORE convert-pages (LLM demoted to visual enhancement)"
    command: |
      STORIES_DIR="{TARGET_DIR}/{PROJECT_DIR}/user_stories"
      [ -d "$STORIES_DIR" ] || { echo "no user_stories dir — skipping primary page generation"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-page-from-story.js \
        --stories-dir "$STORIES_DIR" \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --primary \
        --verbose
    on_failure: ignore

  - id: scaffold-scope-lock-snapshot
    type: deterministic
    description: "v128: snapshot scaffold-generated pages + contract (testids, default export) before any LLM touches them"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-scope-lock-doctor.js \
        --target "{TARGET_DIR}/{FRONTEND_DIR}" \
        --snapshot
    on_failure: ignore

  - id: convert-pages
    type: agentic
    timeout_ms: 2100000   # 35min — complex pages (dashboards, multi-step forms) need more than 25min on mimo
    description: "Convert ONE HTML prototype page to a React component (per-page fanout)"
    # on_failure: ignore — partial page conversion is still useful. v22: 5/6
    # pages converted, 1 failed → frontend phase Failed → downstream
    # merge-convert-reports + design-fidelity-check never ran → ship had no
    # frontend baseline. With ignore, downstream nodes run on whatever pages
    # were produced; partial frontend > no frontend.
    on_failure: ignore
    fanout:
      source: html_pages
      subject_var: page
      # v70: bumped 6 → 8. v69 admin-dashboard cell took 2h04m for convert-pages
      # because admin has 22+ pages (4 waves of 30min at conc=6). Bumping to 8
      # gives 3 waves ≈ 1h30m. Body-level 429 retry absorbs the extra burst load.
      concurrency: 8
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_CONVERT_{page}.md"
    verification_pattern: "page:\\s*{page}"
    scope_guard:
      allow: ["{FRONTEND_DIR}/app/pages/**"]
      deny:
        - "{BACKEND_DIR}/**"
        - "{PROJECT_DIR}/design/**"
        # v93: RR7 framework mode — root.tsx + routes.ts are the canonical
        # entry points (no App.tsx, no main.tsx). LLM convert-pages must not
        # touch these or the route definitions in app/routes/.
        - "{FRONTEND_DIR}/app/root.tsx"
        - "{FRONTEND_DIR}/app/routes.ts"
        - "{FRONTEND_DIR}/app/routes/**"
        - "{FRONTEND_DIR}/app/i18n/**"
        - "{FRONTEND_DIR}/app/layouts/**"
        - "{FRONTEND_DIR}/package.json"
        # v67: lock RR7 config files. v66 evidence: typegen crashed on
        # LLM-mangled vite.config.ts → `./+types/root` never generated →
        # tsc TS2307 across 3 cells. Templates ship the correct RR7
        # vite.config.ts; LLM has no business touching it.
        - "{FRONTEND_DIR}/vite.config.ts"
        - "{FRONTEND_DIR}/tsconfig.json"
        - "{FRONTEND_DIR}/react-router.config.ts"
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/design/html/{FRONTEND_DIR}/{page}.html"
        - "{TARGET_DIR}/{FRONTEND_DIR}/IMPORT_MANIFEST.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_PRD_ROLES.md"
        - "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_SHELL_REPORT.md"
        - ".claude/{FRONTEND}/guides/component-patterns.md"
        - ".claude/{FRONTEND}/guides/styling-guide.md"
        - ".claude/{FRONTEND}/skills/converters/html-to-react-converter.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      Convert ONE HTML prototype page to a React component. The page is `{page}.html`.
      Sibling cells own the other pages — DO NOT touch them.

      PATH ANCHOR (v128 — read carefully): your working directory is the RUN ROOT.
      The frontend you are editing is `{FRONTEND_DIR}/` directly under the run root
      — i.e. write to `{FRONTEND_DIR}/app/pages/...` relative to cwd. The context
      files above live under `{PROJECT_DIR}/` (the docs tree); NEVER write any
      `.tsx` under `{PROJECT_DIR}/{FRONTEND_DIR}/` or any other `{PROJECT_DIR}`
      path — files there are not part of the build and will be discarded.

      INPUT FILE: {PROJECT_DIR}/design/html/{FRONTEND_DIR}/{page}.html

      DETERMINISTIC PAGE — ENHANCE IN PLACE (v128, check FIRST):
        A deterministic page for this screen may ALREADY EXIST under
        {FRONTEND_DIR}/app/pages/ (generated from the user story; its filename
        derives from the {page} slug with the numeric prefix stripped, e.g.
        "03-admin-dashboard" → pages/admin/admin-dashboard.tsx). Search app/pages/
        by slug BEFORE creating anything.
        - If it EXISTS: RESTYLE THAT FILE IN PLACE to mirror the HTML prototype.
          SCOPE-LOCK (deterministically enforced after this node — a violation
          reverts your ENTIRE file to the unstyled deterministic version):
            * KEEP every existing data-testid attribute verbatim (story specs target them)
            * KEEP the default export (same component name)
            * KEEP the data wiring (fetch/dispatch calls + loading/error/empty branches);
              you may relocate them within the file, never delete them
          You own the JSX presentation: layout, Tailwind classes, headings, visual
          structure — make it pixel-perfect around the locked parts.
        - If it does NOT exist: create a single new .tsx file under
          {FRONTEND_DIR}/app/pages/ that mirrors the HTML pixel-for-pixel. Pick a
          sensible component name from the {page} slug (e.g. "01-login" →
          LoginPage.tsx, "15-application-detail" → ApplicationDetailPage.tsx).

      FIDELITY (RULE-F7 + RULE-F8 — gate fails if violated):
        - Read {page}.html FULLY before writing the component
        - Every visible text, form field, button, icon, divider in the HTML must
          appear in the React component (character-for-character match for text)
        - Extract EXACT CSS values from <style>:
            padding: 40px 36px → px-[36px] py-[40px]   (NOT p-8)
            border-radius: 24px → rounded-[24px]
            font-size: 28px → text-[28px]
        - Preserve box-shadow, backdrop-filter

      IMPORTS — STRICT CONTRACT (this is the #1 cause of build failures — obey it exactly):
        - FIRST read IMPORT_MANIFEST.md. It lists EVERY module + named export available in
          this frontend (services/thunks, redux actions, types, enums, hooks, ui, lib).
        - You may import ONLY module paths and symbols that appear in the manifest.
          For API data, dispatch a listed thunk from ~/services/httpServices/* (use the EXACT
          export name shown, e.g. `findAll`, `fetchMeThunk` — do not guess `getApplications`).
          For types/enums, import only listed names from ~/types/* and ~/enums/*.
        - NEVER invent an import. If the data/type/enum you want is not in the manifest, use
          the closest listed item or render a static placeholder. An import of a module or
          symbol not in the manifest breaks the production build (TS2307 / "not exported by")
          and fails the whole frontend. When unsure, import LESS.

      INTEGRATION:
        - Wrap interactive elements with handlers (`onClick={() => { /* TODO */ }}`)
          — no dead buttons (RULE-F2)
        - For role-restricted pages, reference one of: role, isOwner, isAdmin,
          ProtectedRoute, RequireRole, useRole, usePermission (RULE-F5)
        - Use `useTranslation()` and `t('key')` for all display strings (RULE-T6)
          — i18n is already initialized by the convert-shell node
        - Add `data-testid="{page}-..."` to every interactive element (RULE-F10)

      DO NOT:
        - Modify ANY pre-installed framework file (root.tsx, routes.ts, lib/utils.ts,
          services/httpService.ts, redux/store/**, components/ui/**, hooks/providers/**,
          styles/**, utils/errorHandler.ts, package.json, tsconfig.json, vite.config.ts).
          These were copied from canonical templates and are immutable.
        - Modify layouts/*, i18n/*, components/guards/* — convert-shell owns those.
        - Create files outside {FRONTEND_DIR}/app/pages/

      ROUTING NOTE: do not add the route to {FRONTEND_DIR}/app/routes.ts yourself —
      record the suggested route path in your report and a downstream node will wire
      it. (Multiple cells writing to routes.ts in parallel would conflict.)

      REPORT FILE: {STATUS_DIR}/FRONTEND_CONVERT_{page}.md
      Required fields (regex-verifiable):
        page: {page}
        component_name: <PascalCase>
        component_path: <relative path>
        suggested_route: <path string, e.g. /login>
        text_elements_matched: <int>
        form_fields_matched: <int>
        buttons_matched: <int>
        css_arbitrary_values_used: <int>
        testids_added: <int>
        fidelity_estimate: <float 0.0-1.0>

  # v128: convert-pages cells sometimes anchor their Write paths to the absolute
  # `.claude-project/fsp/` prefix they see on every context file and emit pages
  # into `<run>/.claude-project/fsp/{FRONTEND_DIR}/app/pages/` — a tree nothing
  # builds (v127: admin-dashboard 128 stray vs 67 real; company-dashboard 58
  # stray vs 40 real, 19 of which were safety-net stubs covering for the lost
  # work). scope_guard is documentation-only, so the writes succeed silently.
  # This doctor relocates stray app/pages/** into the real frontend (real
  # missing → move; real is a scaffold stub → adopt LLM page, scope-lock
  # enforce downstream still guards the contract) and deletes the stray root.
  - id: scaffold-stray-output-relocate
    type: deterministic
    description: "v128: relocate LLM pages written under {PROJECT_DIR}/{FRONTEND_DIR}/ into the real frontend tree"
    on_failure: ignore
    command: |
