  # admin cell often passes because its pages are simpler; this scaffold
  # narrows the gap so worker/company can hit the same floor.
  #
  # Runs AFTER convert-pages + convert-wire-routes (so LLM gets first
  # crack), BEFORE scaffold-convert-wire-routes (so its emitted routes
  # v93: Parse every .tsx in app/pages/ with the project's local TypeScript
  # compiler API. Files with parse errors (unclosed JSX, unterminated string,
  # unbalanced braces, etc — all common LLM convert-pages output failures)
  # are DELETED so scaffold-page-from-story (below) can re-emit a clean
  # stub from the matching user_story YAML. v93 evidence: SignupPage.tsx
  # had a `<select>` whose attribute value embedded a string with single
  # quotes that broke JSX parsing → 'JSX element form has no corresponding
  # closing tag' cascade. notifications.tsx had unterminated string literal.
  # Both wiped entire frontend typecheck.
  - id: scaffold-jsx-balance-doctor
    type: deterministic
    description: "v93: delete pages with unparseable JSX/TSX so scaffold-page-from-story can replace them with stubs"
