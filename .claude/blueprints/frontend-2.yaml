        --target "{TARGET_DIR}" \
        --frontend-dir "{FRONTEND_DIR}" \
        --verbose

  - id: convert-wire-routes
    type: agentic
    description: "Wire converted pages into app/routes.ts + app/routes/*.routes.ts per RR7 framework mode"
    # v83: prevent cascade-abort. scaffold-convert-wire-routes (deterministic,
    # below) is the fallback that regenerates routes.ts from app/routes/*.routes.ts
    # files. Without this, a convert-wire-routes failure would abort the phase
    # before scaffold-routes-dedupe / scaffold-routes-prune / page-imports-doctor
    # could run.
    on_failure: ignore
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_ROUTES_WIRED.md"
    verification_pattern: "routes_wired:\\s*[0-9]+"
    scope_guard:
      # v93: RR7 uses app/routes.ts (the main aggregator) + app/routes/*.routes.ts
      # (per-domain modules). No App.tsx exists in framework mode.
      allow: ["{FRONTEND_DIR}/app/routes.ts", "{FRONTEND_DIR}/app/routes/**"]
      deny: ["{FRONTEND_DIR}/app/pages/**", "{BACKEND_DIR}/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{STATUS_DIR}/FRONTEND_CONVERT_*.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_PRD_ROLES.md"
        - ".claude/{FRONTEND}/guides/routing-guide.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      Wire every converted page into the RR7 framework-mode route table using
      the `suggested_route` recorded in each FRONTEND_CONVERT_*.md report.

      FILE LAYOUT (RR7 framework mode — NO App.tsx):
        app/routes.ts            — central RouteConfig export; imports from app/routes/*.routes.ts
        app/routes/*.routes.ts   — per-domain route modules (auth, admin, worker, company, public)

      PROCESS:
      1. Read every FRONTEND_CONVERT_*.md file. Each lists:
           component_name, component_path, suggested_route
      2. Group routes by role (auth/guest/admin/etc.) per PROJECT_PRD_ROLES.md
      3. Wire each into the matching app/routes/<role>.routes.ts using the
         existing layout()/route()/index() helpers from @react-router/dev/routes
         that convert-shell already set up.
      4. Ensure app/routes.ts imports every *.routes.ts and merges them.
      5. Preserve the existing `route('*', 'pages/not-found.tsx')` 404 catch-all.
      6. Add necessary route entries; do NOT modify the page components themselves.

      REPORT FILE: {STATUS_DIR}/FRONTEND_ROUTES_WIRED.md
      Required fields (regex-verifiable):
        phase: frontend-wire-routes
        routes_wired: <int>
        roles_covered: <int>
        unmatched_pages: <int>   # pages whose suggested_route could not be placed

  # v63: rootReducer + routes registration. Scans on-disk slice + routes
  # files and emits canonical aggregators. Without these, scaffold-crud-pages
  # writes 12 slice files but rootReducer.ts only has the LLM-written
  # auth/user slices → typecheck cliff with `Property 'notice' does not exist
  # on type {auth, user}` across pages (v62-att2 evidence). Same for routes:
  # scaffold-crud-pages writes per-entity *.routes.ts; top-level routes.ts
  # never imports them → scaffolded pages unreachable.
  - id: normalize-redux-and-routes
    type: deterministic
