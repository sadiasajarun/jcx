    on_failure: ignore

  # v77: derive Create/Update/Response DTOs from each entity's @Column
  # declarations so DTO types match entity enum types. Kills the v76 TS2344
  # `CreateXDto does not satisfy DeepPartial<X>` cascade (status: string vs
  # SomeEnum). Runs AFTER all module scaffolds (so entity files exist) and
  # BEFORE implement (so LLM doesn't author drift). --force overwrites the
  # CRUD scaffold's DTO stubs with entity-aligned ones.
  - id: scaffold-dto-from-entity
