name: backend-2
description: |
  Backend phase — TDD cycle (RED → GREEN → REFACTOR → REVIEW) + gates.
  v2 blueprint with strict artifact contracts on every agentic sub-node.
version: 2
manifest: backend

nodes:
  # ============================================================================
  # TIER 1: PRE-FLIGHT (deterministic)
  # ============================================================================

  - id: pre-check
    type: deterministic
    description: "Verify database entities exist"
    command: |
      ENTITY_COUNT=$(find {TARGET_DIR}/{BACKEND_DIR}/src -name '*.entity.ts' 2>/dev/null | wc -l | tr -d ' ')
      [ "$ENTITY_COUNT" -gt 0 ] || { echo "FAIL: No entity files — run database phase first"; exit 1; }
      echo "Found $ENTITY_COUNT entities"
    on_failure: abort
    abort_message: "Phase 4 (database) must complete first"

  - id: api-doc-check
    type: deterministic
    description: "Verify PROJECT_API.md exists (source of truth for TDD)"
    command: |
      [ -f "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md" ] || exit 1
      echo "PROJECT_API.md found"
    on_failure: abort
    abort_message: "PROJECT_API.md missing — run prd phase first"

  - id: scaffold-structure
    type: deterministic
    description: "Scaffold backend dirs and copy canonical templates (core/base, core/decorators, core/filters, core/guards, core/interceptors, core/pipes, shared, infrastructure/token, config) — single source of truth, no LLM invention"
    command: |
      set -e
      BD="{TARGET_DIR}/{BACKEND_DIR}/src"
      TPL="{CLAUDE_DIR}/{BACKEND}/templates"

      # Core directories
      mkdir -p "$BD/core/base" "$BD/core/decorators" "$BD/core/filters"
      mkdir -p "$BD/core/guards" "$BD/core/interceptors" "$BD/core/pipes" "$BD/core/dto"
      # Infrastructure
      mkdir -p "$BD/infrastructure/mail" "$BD/infrastructure/s3"
      mkdir -p "$BD/infrastructure/token" "$BD/infrastructure/logging"
      mkdir -p "$BD/infrastructure/file-storage"
      # Database
      mkdir -p "$BD/database/migrations" "$BD/database/seeders"
      # Common + shared + config
      mkdir -p "$BD/common/enums" "$BD/config" "$BD/modules"
      mkdir -p "$BD/shared/dtos" "$BD/shared/interfaces"

      # Copy framework templates (idempotent — never overwrite existing files)
      [ -d "$TPL" ] || { echo "FAIL: template dir missing: $TPL"; exit 1; }

      copy_tree() {
        local src="$1" dst="$2"
        [ -d "$src" ] || return 0
        mkdir -p "$dst"
        local copied=0 skipped=0
        for f in "$src"/*.ts; do
          [ -f "$f" ] || continue
          local name=$(basename "$f")
          if [ -f "$dst/$name" ]; then
            skipped=$((skipped+1))
          else
            cp "$f" "$dst/$name"
            copied=$((copied+1))
          fi
        done
        echo "  $(basename "$src"): copied=$copied skipped=$skipped"
      }

      echo "Copying framework templates from $TPL"
      copy_tree "$TPL/core/base"          "$BD/core/base"
      copy_tree "$TPL/core/decorators"    "$BD/core/decorators"
      copy_tree "$TPL/core/filters"       "$BD/core/filters"
      copy_tree "$TPL/core/guards"        "$BD/core/guards"
      copy_tree "$TPL/core/interceptors"  "$BD/core/interceptors"
      copy_tree "$TPL/core/pipes"         "$BD/core/pipes"
      copy_tree "$TPL/shared/dtos"        "$BD/shared/dtos"
      copy_tree "$TPL/shared/interfaces"  "$BD/shared/interfaces"
      copy_tree "$TPL/infrastructure/token"         "$BD/infrastructure/token"
      copy_tree "$TPL/infrastructure/file-storage"  "$BD/infrastructure/file-storage"
      copy_tree "$TPL/config"             "$BD/config"

      # v61 (Tier B): canonical enums + health module so the LLM stops
      # re-authoring the same boilerplate per module:
      #   - common/enums/role.enum.ts — RoleGuard + decorators already import this
      #   - modules/health/health.{controller,module}.ts — liveness/readiness for
      #     ensure-servers + Docker probes
      mkdir -p "$BD/common/enums" "$BD/modules/health" "$BD/modules/dashboard/dtos"
      copy_tree "$TPL/common/enums"          "$BD/common/enums"
      copy_tree "$TPL/modules/health"        "$BD/modules/health"
      # v67: canonical dashboard query endpoint (POST /dashboard/query)
      # serves all frontend dashboard KPI cards + charts. No per-dashboard
      # backend code; the endpoint introspects TypeORM metadata.
      # v93: copy_tree of _dashboard already brings along the dtos/ subdir
      # (template was renamed from dto/ → dtos/ to match stack rule). The
      # second explicit copy was creating an empty dashboard/dto/ folder that
      # caused TS2307 'Cannot find module ./dtos/dashboard-query.dto' until
      # fix-agent eventually recreated the file in the right place.
      copy_tree "$TPL/modules/_dashboard"    "$BD/modules/dashboard"

      # v60 fix: ship canonical test/setup + test/fixtures so the LLM never
      # re-authors the test framework glue. v54..v59 evidence: 21 e2e suites
      # all failed at `closeTestApp` because the LLM-written factory had
      # subtly-wrong cleanup logic. The factory shape stays in templates;
      # LLM only writes per-module .e2e-spec.ts files that USE it.
      BD_TEST="{TARGET_DIR}/{BACKEND_DIR}/test"
      mkdir -p "$BD_TEST/setup" "$BD_TEST/fixtures" "$BD_TEST/e2e"
      copy_tree "$TPL/test/setup"     "$BD_TEST/setup"
      copy_tree "$TPL/test/fixtures"  "$BD_TEST/fixtures"

      # Standalone main.ts — copy only if absent (LLM still owns module wiring there)
      if [ -f "$TPL/main.ts" ] && [ ! -f "$BD/main.ts" ]; then
        cp "$TPL/main.ts" "$BD/main.ts"
        echo "  copied main.ts"
      fi

      # .gitkeep for genuinely-empty dirs (templates already filled the rest)
      for d in database/migrations database/seeders infrastructure/mail infrastructure/s3 infrastructure/logging infrastructure/file-storage; do
        [ ! "$(ls -A "$BD/$d" 2>/dev/null)" ] && touch "$BD/$d/.gitkeep"
      done

      # Sanity: critical base classes must exist after this node
      for f in core/base/base.entity.ts core/base/base.repository.ts core/base/base.service.ts core/base/base.controller.ts; do
        [ -f "$BD/$f" ] || { echo "FAIL: $f missing after scaffold"; exit 1; }
      done
      # Sanity: test framework files must exist (v60 — single source of truth)
      for f in test/setup/test-app.factory.ts test/setup/test-database.ts test/setup/global-setup.ts test/fixtures/auth.fixture.ts test/fixtures/user.fixture.ts; do
        [ -f "{TARGET_DIR}/{BACKEND_DIR}/$f" ] || { echo "FAIL: $f missing after scaffold"; exit 1; }
      done
      # Sanity: v61 templates (enum + health)
      for f in common/enums/role.enum.ts modules/health/health.controller.ts modules/health/health.module.ts; do
        [ -f "$BD/$f" ] || { echo "FAIL: $f missing after scaffold"; exit 1; }
      done

      echo "PASS: Backend structure scaffolded from templates"
    on_failure: abort
    abort_message: "Failed to scaffold backend from {CLAUDE_DIR}/{BACKEND}/templates — verify templates exist and {CLAUDE_DIR}/{BACKEND} resolves correctly"

  # ============================================================================
  # v62 — CRUD MODULE SCAFFOLDING (deterministic, replaces LLM CRUD boilerplate)
  # ============================================================================
  #
  # Flow:
  #   1. emit-module-plan (agentic) reads PROJECT_API.md + PROJECT_DATABASE.md
  #      and emits MODULE_PLAN.yaml listing every CRUD module + non-CRUD ones.
  #   2. scaffold-crud-modules (deterministic) expands the _crud/ template tree
  #      per CRUD entry, producing entity + repo + service + controller + module
  #      + DTOs + e2e spec. LLM-customized files (re-runs) are preserved.
  #   3. implement (agentic, existing) fans out per module but now writes ONLY:
  #      - Domain-specific service methods beyond CRUD
  #      - Non-CRUD modules (auth, file upload, websocket gateways)
  #      - Entity relation wiring (FK foreign-side inverse)
  #
  # If MODULE_PLAN.yaml is missing or empty (e.g. project has no CRUD modules),
  # scaffold-crud-modules no-ops; existing implement fanout still runs.

  # v78: derive backend/.env.example deterministically by grepping
  # `process.env.X` + `configService.get('X')` in source. Satisfies
  # RULE-B4 (env-example must derive from PROJECT_KNOWLEDGE.md). Idempotent.
  - id: scaffold-environment
    type: deterministic
    description: "v78: derive backend .env.example from process.env.* references"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-environment.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --side backend
    on_failure: ignore

  # v75: derive MODULE_PLAN.yaml deterministically from PROJECT_DATABASE.md +
  # PROJECT_API.md + PROJECT_KNOWLEDGE.md BEFORE the LLM-driven emit-module-plan
  # runs. The agentic node still runs after this and may refine the result;
  # but if it fails (mimo 429, watchdog, etc.) the deterministic baseline
  # ensures downstream scaffolds always have something to work with.
  #
  # v71 evidence: admin-dashboard cell's emit-pages-plan failed at 429 →
  # cascade → 0/10 story pass. v71 also produced a MODULE_PLAN with only
  # 3 modules vs the expected 12+. Scaffold-module-plan against the same
  # docs produces 31 modules + auth + 2 uploads in ~100ms.
  - id: scaffold-module-plan
    type: deterministic
    description: "v75: derive MODULE_PLAN.yaml from docs (LLM-independent baseline; emit-module-plan can still refine)"
    command: |
      STATUS_DIR="{TARGET_DIR}/{STATUS_DIR}"
      DOCS_DIR="{TARGET_DIR}/{PROJECT_DIR}/docs"
      [ -f "$DOCS_DIR/PROJECT_DATABASE.md" ] || { echo "no PROJECT_DATABASE.md — skipping"; exit 0; }
      [ -f "$DOCS_DIR/PROJECT_API.md" ] || { echo "no PROJECT_API.md — skipping"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-module-plan.js \
        --api "$DOCS_DIR/PROJECT_API.md" \
        --db "$DOCS_DIR/PROJECT_DATABASE.md" \
        --knowledge "$DOCS_DIR/PROJECT_KNOWLEDGE.md" \
        --out "$STATUS_DIR/MODULE_PLAN.yaml"
    on_failure: ignore

  - id: emit-module-plan
    type: agentic
    timeout_ms: 1200000   # 20min — small structured emit
    description: "Emit MODULE_PLAN.yaml from PROJECT_API.md + PROJECT_DATABASE.md (one entry per module)"
    # v83: prevent cascade-abort. scaffold-module-plan (deterministic,
    # earlier in pipeline) is the fallback that derives MODULE_PLAN.yaml
    # from PROJECT_DATABASE.md + PROJECT_API.md + PROJECT_KNOWLEDGE.md.
    # Without on_failure: ignore, every downstream scaffold-crud-module,
    # scaffold-dto-from-entity, scaffold-seed-script dies if mimo hits
    # MAX_TURNS here.
    on_failure: ignore
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
    verification_pattern: "modules:"
    scope_guard:
      allow: ["{STATUS_DIR}/MODULE_PLAN.yaml"]
      deny: ["{BACKEND_DIR}/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_DATABASE.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
        - ".claude/{BACKEND}/templates/modules/_crud/MODULE_PLAN.example.yaml"
    tool_profile:
      allow: [Read, Write, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch, Edit, MultiEdit]
    prompt: |
      Emit `{STATUS_DIR}/MODULE_PLAN.yaml` — the deterministic input that
      `scaffold-crud-modules` consumes to generate CRUD module trees.

      EXAMPLE SCHEMA + COMMENTS:
      Read `.claude/{BACKEND}/templates/modules/_crud/MODULE_PLAN.example.yaml`
      first. The schema is strict — unknown keys reject. Use the EXAMPLE as
      your shape template.

      EXTRACTION RULES:
      1. For every module/resource referenced in PROJECT_API.md that exposes
         standard CRUD endpoints (GET list, GET :id, POST, PATCH :id, DELETE :id),
         emit an entry under `modules:`.
      2. For each module, list `fields:` matching the entity columns from
         PROJECT_DATABASE.md. For each field include name + type + nullable +
         validators (class-validator decorators like IsString, IsEmail, MinLength:8)
         + swagger metadata (description, example). Set `response: false` on
         sensitive fields (password, internal tokens).
      3. List `relations:` (ManyToOne/OneToMany/etc.) as found in
         PROJECT_DATABASE.md. The generator emits FK column + commented-out
         ManyToOne decorator; the LLM-implement node wires the inverse.
      4. Modules whose semantics go BEYOND CRUD (custom controllers,
         multi-step orchestration) go under `non_crud_modules:` with a
         one-line note. Workflows / file uploads / auth get DEDICATED
         sections (see 5-7); do NOT also list them under non_crud_modules.

      5. AUTH (v66+): if the API has /auth/login, /auth/signup, /auth/refresh,
         emit an `auth:` section (not under modules:). Schema:
           auth:
             user_entity: User
             user_entity_module: user            # kebab dir name
             identifier_field: email             # what users log in with
             password_field: passwordHash       # column on User entity
             roles: [user, manager, admin]
             access_ttl: '1h'
             refresh_ttl: '7d'
             signup_fields: [...]                # array of field objects
         The scaffold-auth-module generator produces the entire auth module
         deterministically; the LLM-implement fanout does NOT touch auth.

      6. WORKFLOWS (v67+): if an entity has a state column with multiple
         transitions, emit a `workflows:` entry instead of leaving it as
         freeform business logic. Schema:
           workflows:
             - name: <kebab>
               entity: <PascalCase>
               state_field: currentState
               initial: <state name>
               states: [list]
               transitions:
                 - { from: stateA, to: stateB, action: <camelCase>, guard: 'role.admin' }
         The scaffold-workflow-module generator produces a state-machine
         class + per-action POST endpoint per transition. Use `from: '*'`
         for transitions valid from any state.

      7. UPLOADS (v67+): for file-upload modules, emit an `uploads:` entry.
         Schema:
           uploads:
             - name: <kebab>
               entity: <PascalCase>
               storage: s3                       # s3 | local
               max_size_mb: 10
               allowed_mime: [image/png, application/pdf]
               fields: [...]                     # metadata cols on entity

      See MODULE_PLAN.example.yaml for the full shape demonstrated on FSP.

      DO NOT:
      - Invent modules that aren't in PROJECT_API.md or PROJECT_DATABASE.md
      - Skip required fields (entity, fields, name)
      - Use snake_case for the `name` key (must be kebab-case)
      - Duplicate auth/workflow/upload modules under both `modules:` AND
        `non_crud_modules:` AND a dedicated section — pick one

      === YAML QUOTING — STRICT RULES ===
      The example MODULE_PLAN.yaml has a "YAML QUOTING RULES" header that
      explains this. Reread before emitting. Quick reference:
        - Bare validators (no arg):   `IsString`, `IsEmail`, `IsNotEmpty`
        - Simple-arg validators:      `MinLength:8`, `MaxLength:255`, `IsEnum:RoleEnum`
        - Regex / complex validators (Matches, IsIn): MUST use object form:
            `{ name: Matches, arg: '^010-\d{4}-\d{4}$' }`
          NEVER use inline string form like `Matches:"010-..."` — embedded
          colons + quotes + backslashes break YAML flow-sequence parsing.
        - Prefer block sequence (`validators:\n  - IsString\n  - ...`) over
          flow sequence (`validators: [IsString, ...]`) for safety.
      A parse error here aborts scaffold-crud-modules; the LLM implement
      fanout then has to write every CRUD module from scratch. Get this right.

  - id: scaffold-crud-modules
    type: deterministic
    description: "Expand _crud/ template tree per MODULE_PLAN.yaml entry (entity + repo + service + controller + module + dtos + e2e spec)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping CRUD scaffold (existing LLM implement will write everything)"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-crud-module.js \
        --plan "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/modules/_crud"
    on_failure: ignore

  # v66: scaffold the canonical auth module (login/signup/refresh/logout/me)
  # when MODULE_PLAN.yaml has an `auth:` section. Generator no-ops if the
  # section is missing — projects that have authentication but want LLM
  # implementation can omit `auth:` and list the module under non_crud_modules
  # instead.
  - id: scaffold-auth-module
    type: deterministic
    description: "Expand _auth/ template per MODULE_PLAN.yaml auth: section"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping auth scaffold"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-auth-module.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/modules/_auth"
    on_failure: ignore

  # v66: scaffold state-machine workflow modules when MODULE_PLAN.yaml has a
  # `workflows:` section. Generator emits per-entity Workflow class +
  # transition controller and additively registers them in the existing
  # entity module. No-ops if section is missing.
  - id: scaffold-workflow-modules
    type: deterministic
    description: "Expand _workflow/ template per MODULE_PLAN.yaml workflows: section"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping workflow scaffold"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-workflow-module.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/modules/_workflow"
    on_failure: ignore

  # v66: scaffold file-upload modules + file-storage infrastructure when
  # MODULE_PLAN.yaml has an `uploads:` section. Generator emits multipart
  # upload controller + metadata DTO and registers FileStorageModule in
  # the entity's module. The file-storage/ infrastructure tree is copied
  # by the core-templates node above. No-ops if section is missing.
  - id: scaffold-upload-modules
    type: deterministic
    description: "Expand _upload/ template per MODULE_PLAN.yaml uploads: section"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping upload scaffold"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-upload-module.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/modules/_upload"
    on_failure: ignore

  # ROOM-MEMBERSHIP capability (Tier 2) — emits Room + RoomMembership entities,
  # membership service, and a room-scoped guard that COMPOSES the app-level RBAC
  # (RULE-B8). Triggered by MODULE_PLAN `rooms:` OR any `realtime:` entry with
  # rooms:true. Must run BEFORE scaffold-realtime-gateway (the gateway imports
  # RoomMembershipService) and BEFORE app-module-registry (so the module registers).
  # 1-on-1 vs group is one schema: a direct chat is a Room(type='direct') with 2
  # memberships — no separate scaffold. See feature-scaffold capability model.
  - id: scaffold-room-membership
    type: deterministic
    description: "ROOM capability: Room+RoomMembership entities + room-scoped permission guard (composes RBAC)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping room-membership"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-room-membership.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # REALTIME capability (Tier 2) — emits a @WebSocketGateway per MODULE_PLAN
  # `realtime:` entry (cookie-JWT handshake auth RULE-B7, room join/leave, one
  # @SubscribeMessage per event). Adds the websocket deps to package.json. When
  # rooms:true it composes scaffold-room-membership (above). Self-contained: no
  # template dir, emits inline.
  - id: scaffold-realtime-gateway
    type: deterministic
    description: "REALTIME capability: @WebSocketGateway per realtime: entry (cookie-JWT auth, room-scoped events)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping realtime-gateway"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-realtime-gateway.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # PAYMENT capability (Tier 2) — TossPayments adapter (confirm + partial/full cancel)
  # + refund standard-table calc + payment service/controller. PG-integration + escrow
  # boilerplate is money-adjacent grammar that must be deterministic, not LLM-invented.
  # Triggered by MODULE_PLAN `payment:` (provider must be toss in v1). Operates on the
  # project's Payment/Booking entities (from scaffold-entities). See feature-scaffold
  # capability model.
  - id: scaffold-payment-module
    type: deterministic
    description: "PAYMENT capability: TossPayments adapter + refund-policy calc + payment module"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping payment-module"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-payment-module.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # SCHEDULING capability (Tier 2) — slot computation (weekly rule + EXTRA/BLOCK
  # exceptions → 30-min slots) + slot-lock double-booking prevention (unique-insert =
  # atomic gate → 409 SLOT_CONFLICT) + booking-calendar service. Double-booking races
  # are money-adjacent; the lock grammar must be deterministic. Triggered by
  # MODULE_PLAN `scheduling:`. Requires the lock entity to carry UNIQUE(providerId, slotStart).
  - id: scaffold-scheduling-module
    type: deterministic
    description: "SCHEDULING capability: slot math + slot-lock double-booking guard + booking calendar"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping scheduling-module"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-scheduling-module.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # SCHEDULED-JOBS capability (Tier 2) — recurring (@nestjs/schedule @Cron) + delayed
  # (BullMQ per-entity timers: "expire in 24h", "auto-confirm in 72h"). The scheduling/
  # queue wiring + idempotency-guard shape is deterministic; each job body is an LLM seam.
  # Triggered by MODULE_PLAN `cron:`. Adds @nestjs/schedule + bullmq deps; needs REDIS_URL + TZ.
  - id: scaffold-cron-jobs
    type: deterministic
    description: "SCHEDULED-JOBS capability: @Cron recurring + BullMQ delayed jobs (idempotent shape)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping cron-jobs"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-cron-jobs.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # PUSH-NOTIFICATION capability (Tier 2) — the SEND side (distinct from in-app CRUD):
  # FCM adapter + a single dispatch(triggerKey, recipient, vars) funnel + template table
  # (code-constant copy) + quiet-hours (transactional bypass). Triggered by MODULE_PLAN
  # `push:`. Adds firebase-admin; needs GOOGLE_APPLICATION_CREDENTIALS.
  - id: scaffold-push-notification
    type: deterministic
    description: "PUSH capability: FCM dispatcher + template table + quiet-hours (one dispatch() funnel)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping push-notification"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-push-notification.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # GEO-RADIUS-SEARCH capability (Tier 2) — Postgres cube/earthdistance radius query
  # ("pins near me"): earth_box(...) @> bbox pre-filter + earth_distance precise filter +
  # distance sort. Auto-enables the extensions on boot. Triggered by MODULE_PLAN `geo:`.
  - id: scaffold-geo-search
    type: deterministic
    description: "GEO capability: earthdistance radius search (nearest-first) on a lat/lng table"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping geo-search"; exit 0; }
