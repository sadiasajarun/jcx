        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v78: emit one `test/fixtures/<entity>.fixture.ts` per CRUD module so
  # generate-tests + scaffold-unit-tests have ready-made seed-data helpers.
  - id: scaffold-fixtures-per-entity
    type: deterministic
    description: "v78: emit test/fixtures/<entity>.fixture.ts per CRUD module"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      [ -f "$PLAN" ] || { echo "no MODULE_PLAN.yaml — skipping fixtures scaffold"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-fixtures-per-entity.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  # v78: per service.ts extending BaseService → Jest unit test with mocked
  # Repository. Augments generate-tests (which produces e2e tests).
  - id: scaffold-unit-tests
