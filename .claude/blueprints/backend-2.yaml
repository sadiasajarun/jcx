        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  # v67: scaffold the seed script from MODULE_PLAN.auth + _fixtures.yaml.
  # Fixes the v66 root cause: 322/326 tests failed at loginAndGetCookie
  # because no seed script was written and fixture-defined users never
  # made it into the DB. RULE-B3 mandates this; v67 makes it deterministic.
  - id: scaffold-seed-script
    type: deterministic
    description: "Generate backend/src/database/seed.ts from MODULE_PLAN.auth (reads _fixtures.yaml at runtime)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping seed scaffold"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-seed-script.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/database/seed" \
        --project "{project}"
    on_failure: ignore

  # v89: extend seed.ts to seed ALL fixture sections (companies, applications,
  # documents, etc.) in FK-dependency order with a uuidMap that resolves
  # fixture-key references to real generated UUIDs. Without this, user
  # fixtures referencing `companyId: comp_uuid_active_1` (a literal string)
  # cause Postgres UUID parse errors and the whole test-api/test-browser
  # phase fails. v87 evidence: seed only ran seedUsers; companies were
  # never created; smoke-test failed with FK violation cascade.
  - id: scaffold-seed-script-multi-entity
    type: deterministic
    description: "v89: patch seed.ts to seed companies/applications/documents + map fixture keys → UUIDs"
    command: |
      FIXTURES="{TARGET_DIR}/{PROJECT_DIR}/user_stories/_fixtures.yaml"
      [ -f "$FIXTURES" ] || { echo "no _fixtures.yaml — skipping"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-seed-script-multi-entity.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --fixtures "$FIXTURES" \
        --verbose
    on_failure: ignore

  # v89: rewrite @Controller('camelCasePath') to @Controller('kebab-case-path')
  # to match PROJECT_API.md spec. Every FE httpService call hits /bank-accounts
  # but LLM-emitted controller mounts on /bankAccounts → 404 cascade in
  # integrate phase + test-browser. v87 evidence: 8 camelCase paths across 4
  # controllers (bankAccounts, adminServiceTypes, paymentRequests, refundRecords).
  - id: scaffold-controller-route-doctor
    type: deterministic
    description: "v89: camelCase @Controller paths → kebab-case (matches PROJECT_API.md spec)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-controller-route-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v104: ensure controllers with @Roles() also have @UseGuards(JwtAuthGuard,
  # RolesGuard). Without the guards, @Roles is just metadata and NestJS
  # silently bypasses RBAC. v103 evidence: backend-evaluator flagged this as
  # P0 across application/document/bank-account/cancellation controllers
  # (25+ endpoints wide open). Per template_wins_LLM + doctors_over_RTA.
  - id: scaffold-roles-guard-doctor
    type: deterministic
    description: "v104: add @UseGuards(JwtAuthGuard, RolesGuard) to @Roles-decorated controllers (RBAC enforcement)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-roles-guard-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v105: parse PROJECT_API.md endpoint tables, emit 501-Not-Implemented
  # stubs for documented endpoints with no matching controller method.
  # Converts test-browser "HTTP 404 (not implemented)" into clear
  # NotImplementedException — visible at gate time, not silently failing
  # at story-runner time. v104 evidence: 15+ stories per cell failed
  # because endpoints (`/dashboard/stats`, `/companies/:id`, etc.) were
  # documented but never emitted by the LLM. v104 snapshot verification:
  # 54 stubs added (40 already implemented, 16 still need a controller),
  # 0 typecheck errors. Per template_wins_LLM + doctors_over_RTA.
  - id: scaffold-contract-doctor
    type: deterministic
    description: "v105: stub PROJECT_API.md endpoints with no matching controller method (404 → 501 explicit signal)"
    command: |
      API_MD="{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
      [ -f "$API_MD" ] || { echo "no PROJECT_API.md — skipping contract-doctor"; exit 0; }
      node {CLAUDE_DIR}/v2/scripts/scaffold-contract-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --api-md "$API_MD" \
        --verbose
    on_failure: ignore

  # v108: TypeORM QueryBuilder snake_case → camelCase property rewriter.
  # Root cause: TypeORM's QB resolves property names via entity metadata, not
  # DB column names — qb.orderBy('app.created_at') throws
  #   TypeError: Cannot read properties of undefined (reading 'databaseName')
  # at runtime (HTTP 500, not a typecheck error). LLMs reliably use snake_case
  # in QB calls matching the DB column name rather than the TS property.
  # v107 evidence: 18 occurrences across application/payment-request/
  # cancellation-refund-policy repositories → every admin query returned 500.
  - id: scaffold-querybuilder-camelcase-doctor
    type: deterministic
    description: "v108: rewrite snake_case QueryBuilder property refs to camelCase (runtime 500 → correct query)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-querybuilder-camelcase-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v108: RolesGuard emits @Roles('10','99') string literals but JWT carries
  # numeric role values — strict === fails → 403 on all role-protected admin
  # endpoints even with the correct role. Coerce both sides to String.
  # v107 evidence: operator (role=10) got 403 on /admin/settings/bank-accounts.
  - id: scaffold-rolesguard-coerce-doctor
    type: deterministic
    description: "v114: reconcile RolesGuard via canonical number↔name role map (numeric JWT role vs string @Roles literals → 403)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-rolesguard-coerce-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v114: fix the falsy-zero role bug in JWT payload construction. The LLM wrote
  # `role: u.role || 'user'` in auth.service; since DB roles are numeric (0=
  # foreign_worker), `0 || 'user'` === 'user' → every foreign_worker's JWT carried
  # role 'user' → RolesGuard 403'd every worker endpoint (login still succeeded).
  # Runs AFTER the rolesguard doctor; together they unblock authenticated stories.
  - id: scaffold-jwt-role-nullish-doctor
    type: deterministic
    description: "v114: fix falsy-zero role default in JWT payload (role: x.role || 'user' → ?? — 0 is a valid role)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-jwt-role-nullish-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v69: scaffold canonical e2e .spec.ts files for every standard endpoint
  # (CRUD modules + auth + workflows + uploads + dashboard query). Eliminates
  # the largest remaining LLM surface — v66/v67 evidence: generate-tests
  # fanout authored 12-24 spec files mostly from scratch, hitting 30-50%
  # test failures from boilerplate bugs (wrong cookie shape, wrong status
  # code expectations, missing supertest default import, etc.). Deterministic
  # scaffold produces happy + auth-boundary + role-boundary tests per
  # endpoint. LLM-generate-tests fanout below now only APPENDS describes
  # for custom endpoints not covered here.
  - id: scaffold-test-specs
    type: deterministic
    description: "Generate canonical .e2e-spec.ts per MODULE_PLAN entry (CRUD/auth/workflows/uploads/dashboard)"
    command: |
      PLAN="{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml"
      if [ ! -f "$PLAN" ]; then
        echo "no MODULE_PLAN.yaml — skipping test-spec scaffold (LLM will author)"
        exit 0
      fi
      node {CLAUDE_DIR}/v2/scripts/scaffold-test-specs.js \
        --spec "$PLAN" \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --templates "{CLAUDE_DIR}/{BACKEND}/templates/test/_spec" \
        --api-prefix "api"
    on_failure: ignore

  # ============================================================================
  # PHASE 5a — RED: generate failing tests
  # ============================================================================

  - id: generate-tests
    type: agentic
    # v67: fanout — was a single-session generate-tests that took 34min
    # writing ALL 12 spec files sequentially (v66 evidence). Now one cell
    # per module at concurrency 4 → expected ~10min wall-clock. Mirrors
    # implement-fanout shape: required_output_file per module, then a
    # merge-test-reports deterministic step aggregates.
    timeout_ms: 1500000   # 25min — per-cell, not the whole phase
    description: "RED — write e2e tests for ONE module's controller (per-module fanout)"
    on_failure: ignore  # partial coverage > total failure (mirrors implement)
    # v78b SPEED-UP: skip the LLM generate-tests when scaffold-test-specs
    # already populated e2e coverage. Exit 0 = run; non-zero = skip.
    # v78 evidence: scaffold-test-specs wrote 16 e2e specs — generate-tests
    # then re-emitted overlapping work for 20-30min wall-clock.
    #
    # v79b AUDIT 5 fix: gate ONLY on e2e count, not also on unit count.
    # generate-tests' output IS e2e tests (mirror of scaffold-test-specs);
    # unit-test coverage from scaffold-unit-tests is orthogonal and
    # shouldn't trigger a re-run when e2e is already rich.
    condition: |
      E2E=$(find "{TARGET_DIR}/{BACKEND_DIR}/test/e2e" -name '*.e2e-spec.ts' 2>/dev/null | wc -l | tr -d ' ')
      UNIT=$(find "{TARGET_DIR}/{BACKEND_DIR}/test/unit" -name '*.spec.ts' 2>/dev/null | wc -l | tr -d ' ')
      echo "scaffolded test coverage: e2e=$E2E unit=$UNIT (skip generate-tests if e2e >= 5)"
      # Run only if e2e coverage is thin (< 5).
      [ "$E2E" -lt 5 ]
    fanout:
      source: backend_modules
      subject_var: module
      # v70: bumped 4 → 6. Body-level 429 retry (commit c942b83) absorbs
      # cluster-rate-limit bursts. Mimo healthy on new key tp-sby0c2 as
      # of 2026-05-28. v69 generate-tests was 25min at conc=4 (3 waves);
      # conc=6 → 2 waves ≈ 15min expected.
      concurrency: 6
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/BACKEND_TEST_{module}.md"
    verification_pattern: "module:\\s*{module}"
    scope_guard:
      allow: ["{BACKEND_DIR}/test/**"]
      deny:
        - "{BACKEND_DIR}/src/modules/**/*.controller.ts"
        - "{BACKEND_DIR}/src/modules/**/*.service.ts"
        - "{BACKEND_DIR}/src/modules/**/*.dto.ts"
        # v60 fix: protect the canonical test framework files. scaffold-structure
        # already shipped them; if the LLM rewrites them we regress to the v54..v58
        # "21 suites fail at closeTestApp" cliff. Per-module specs are the only
        # things this node may author.
        - "{BACKEND_DIR}/test/setup/**"
        - "{BACKEND_DIR}/test/fixtures/**"
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_DATABASE.md"
        - "{TARGET_DIR}/{STATUS_DIR}/MISSING_ENDPOINTS.yaml"
        - ".claude/{BACKEND}/guides/testing-guide.md"
        - ".claude/{BACKEND}/guides/workflow-generate-e2e-tests.md"
        # v60 fix: surface the canonical test framework so the LLM consumes
        # createTestApp/closeTestApp/loginAndGetCookie/createTestUser instead
        # of authoring its own factory.
        - "{TARGET_DIR}/{BACKEND_DIR}/test/setup/test-app.factory.ts"
        - "{TARGET_DIR}/{BACKEND_DIR}/test/setup/test-database.ts"
        - "{TARGET_DIR}/{BACKEND_DIR}/test/fixtures/auth.fixture.ts"
        - "{TARGET_DIR}/{BACKEND_DIR}/test/fixtures/user.fixture.ts"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      You are in the RED phase of TDD for ONE module: `{module}`.
      Sibling cells own the other modules — DO NOT touch them.

      v69: a CANONICAL `.e2e-spec.ts` already exists at
      `{BACKEND_DIR}/test/e2e/{module}.e2e-spec.ts` (written by
      scaffold-test-specs from MODULE_PLAN.yaml). It covers the standard
      shape: happy path + auth boundary + role boundary for the standard
      endpoints (CRUD/auth/workflow/upload/dashboard).

      YOUR JOB: read that file first, then APPEND new `describe(...)` blocks
      ONLY for endpoints NOT already covered by the scaffold — i.e. custom
      endpoints declared in PROJECT_API.md that aren't standard
      CRUD/auth/workflow/upload (e.g. `/auth/send-verification-code`,
      `/auth/forgot-password`, `/admin/special-action`, etc.).

      RULES:
      - NEVER rewrite an existing describe block in the scaffolded file
      - NEVER author your own test-app factory / auth fixture (use
        ../setup/test-app.factory and ../fixtures/* as-is)
      - If the scaffolded file already covers everything in PROJECT_API.md,
        emit a report with `tests_generated: 0` (the scaffold did the work)

      Original prompt continued below — applies only to the custom-endpoint
      tests you append:

      === CANONICAL TEST FRAMEWORK (ALREADY EXISTS — DO NOT REWRITE) ===
      The framework glue under {BACKEND_DIR}/test/setup/ and
      {BACKEND_DIR}/test/fixtures/ is the single source of truth. Read these
      files before writing any spec — they are already wired up:

        test/setup/test-app.factory.ts
          - createTestApp(options?): Promise<TestAppContext>
              returns { app, module, dataSource }
          - closeTestApp(context): Promise<void>   (idempotent, null-safe)

        test/setup/test-database.ts
          - cleanDatabase(dataSource): Promise<void>   (TRUNCATE all entities)
          - seedDatabase(dataSource, seeds): Promise<void>

        test/fixtures/auth.fixture.ts
          - loginAndGetCookie(app, email, password): Promise<string>  (cookie header value)
          - authCookie(token): string                                  (build Cookie header)

        test/fixtures/user.fixture.ts
          - createTestUser(dataSource, { email, password?, role?, extras? }): Promise<CreatedTestUser>

      DO NOT author your own test-app factory, cookie helper, or createUser
      helper. DO NOT modify files under test/setup/ or test/fixtures/. The
      scope_guard will reject changes to those paths.

      === SPEC SHAPE ===
      Every .e2e-spec.ts uses this skeleton.
      CRITICAL: use the default import for `supertest`. `import * as supertest`
      brings in the module-as-namespace whose typeof has no call signatures
      → `supertest(app)` fails with TS2349 "This expression is not callable".

        import supertest from 'supertest';
        import { createTestApp, closeTestApp, TestAppContext } from '../setup/test-app.factory';
        import { cleanDatabase } from '../setup/test-database';
        import { createTestUser } from '../fixtures/user.fixture';
        import { loginAndGetCookie } from '../fixtures/auth.fixture';

        describe('<Resource> E2E', () => {
          let ctx: TestAppContext;
          let cookie: string;

          beforeAll(async () => {
            ctx = await createTestApp();
            const user = await createTestUser(ctx.dataSource, { email: 'spec@test.com', role: 'admin' });
            cookie = await loginAndGetCookie(ctx.app, user.email, user.password);
          });

          beforeEach(async () => { await cleanDatabase(ctx.dataSource); });

          afterAll(async () => { await closeTestApp(ctx); });

          // ... per-endpoint tests using supertest(ctx.app.getHttpServer())...
        });

      OUTPUT (this cell writes EXACTLY two files):
      1. {BACKEND_DIR}/test/e2e/{module}.e2e-spec.ts — the spec for THIS module
      2. {STATUS_DIR}/BACKEND_TEST_{module}.md — YAML-frontmatter report:
           module: {module}
           phase: backend-red
           tests_generated: <int>
           endpoints_covered: <int>
           test_file: test/e2e/{module}.e2e-spec.ts

      EACH TEST MUST:
      - Assert status code from PROJECT_API.md
      - Assert response shape (at least top-level keys)
      - Cover auth requirement (public / user / admin)
      - Include boundary cases: invalid body, missing auth, wrong role

      CROSS-GENERATION SELF-HEAL:
      If {STATUS_DIR}/MISSING_ENDPOINTS.yaml exists AND its missing_endpoints
      list contains an entry whose `resource` matches `{module}` (or is closely
      related), include those routes in this spec too. Sibling cells handle
      their own modules.

      DO NOT:
      - Create or modify controllers, services, or DTOs
      - Modify test/setup/** or test/fixtures/** (use them as-is)
      - Write tests for any module other than `{module}`
      - Write tests that trivially pass without implementation

  - id: merge-test-reports
    type: deterministic
    description: "v67: aggregate per-module BACKEND_TEST_*.md into BACKEND_TESTS_GENERATED.md (mirrors merge-implement-reports)"
    command: |
      STATUS_DIR="{TARGET_DIR}/{STATUS_DIR}"
      cd "$STATUS_DIR" || exit 1
      OUT="$STATUS_DIR/BACKEND_TESTS_GENERATED.md"

      # Sum counters across per-module reports
      total=0
      endpoints=0
      modules=""
      files=""
      for f in BACKEND_TEST_*.md; do
        [ -f "$f" ] || continue
        m=$(grep -E '^module:' "$f" | head -1 | awk '{print $2}')
        n=$(grep -E '^tests_generated:' "$f" | head -1 | awk '{print $2}')
        e=$(grep -E '^endpoints_covered:' "$f" | head -1 | awk '{print $2}')
        n=${n:-0}; e=${e:-0}
        total=$((total + n))
        endpoints=$((endpoints + e))
        modules="$modules - $m\n"
        files="$files - test/e2e/$m.e2e-spec.ts\n"
      done

      {
        echo "phase: backend-red"
        echo "tests_generated: $total"
        echo "endpoints_covered: $endpoints"
        echo "modules_covered:"
        printf "$modules"
        echo "test_files:"
        printf "$files"
      } > "$OUT"
      echo "merge-test-reports: wrote $OUT (tests_generated=$total, endpoints=$endpoints)"
    on_failure: ignore

  - id: normalize-backend-tests-report
    type: deterministic
    description: "Substitute placeholders + inject YAML-pair duplicates for markdown-table rows in BACKEND_TESTS_GENERATED.md (model-agnostic backstop)"
    command: |
      # v49 evidence: mimo wrote `# Backend Tests Generated Report\n**Phase**: backend-red`
      # markdown heading instead of YAML `tests_generated: <int>`. Same defect
      # class as v46 design phase_complete drift. normalize-docs.js's
      # markdown-table→YAML-pair pass + placeholder substitution catches this
      # regardless of which model wrote the report. Idempotent.
      node {CLAUDE_DIR}/v2/scripts/normalize-docs.js {project} \
        "{TARGET_DIR}/{STATUS_DIR}/BACKEND_TESTS_GENERATED.md"
    on_failure: ignore

  - id: verify-red
    type: deterministic
    description: "Confirm test files exist (RED state)"
    command: |
      cd {TARGET_DIR}/{BACKEND_DIR}
      TEST_COUNT=$(find test -name '*.e2e-spec.ts' -o -name '*.spec.ts' 2>/dev/null | wc -l | tr -d ' ')
      [ "$TEST_COUNT" -gt 0 ] || { echo "FAIL: no test files generated"; exit 1; }
      echo "RED confirmed — $TEST_COUNT test files"
    on_failure: abort

  # ============================================================================
  # PHASE 5b — GREEN: implement to pass tests
  # ============================================================================

  - id: implement
    type: agentic
    timeout_ms: 2400000   # 40min — heavy modules (11-state-application-lifecycle, admin-dashboard) hit 25min wall in v25
    description: "GREEN — implement {module} module to make its tests pass"
    # on_failure: ignore — partial fanout success is still useful. v22 evidence:
    # 8/12 modules implemented but implement marked FAIL → merge-implement-reports
    # never ran → BACKEND_IMPLEMENTATION_REPORT.md never written. With ignore,
    # the merge node runs and aggregates whatever partials exist. If NONE exist,
    # merge-implement-reports' own check (set -e + PARTIALS empty test) fails
    # the phase correctly.
    on_failure: ignore
    fanout:
      source: backend_modules
      subject_var: module
      # v90: bumped 6 → 4. v89 evidence: 3/12 implement-fanout cells failed
      # with mimo 429 (Too Many Requests) because 6-wide concurrent blast
      # exceeded SGP per-account TPM. Trading ~10min slower wall-clock
      # (1 extra wave) for ZERO 429 failures.
      concurrency: 4
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/BACKEND_IMPLEMENT_{module}.md"
    verification_pattern: "module:\\s*{module}"
    scope_guard:
      allow: ["{BACKEND_DIR}/src/modules/{module}/**", "{BACKEND_DIR}/src/modules/**"]
      deny:
        - "{BACKEND_DIR}/test/**"
        # v66: protect scaffold-generated test framework + auth module +
        # core base classes from LLM rewrites. v64 evidence: implement-fanout
        # overrode BaseController methods with wrong return shapes (now
        # normalized away), but the safer fix is preventing the override
        # entry-point in the first place.
        - "{BACKEND_DIR}/src/core/base/**"
        - "{BACKEND_DIR}/src/modules/auth/**"
        - "{BACKEND_DIR}/src/modules/dashboard/**"
        - "{BACKEND_DIR}/src/common/enums/**"
        - "{BACKEND_DIR}/src/infrastructure/file-storage/**"
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_DATABASE.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
        - "{TARGET_DIR}/{STATUS_DIR}/MISSING_ENDPOINTS.yaml"
        - ".claude/{BACKEND}/guides/best-practices.md"
        - ".claude/{BACKEND}/guides/routing-and-controllers.md"
        - ".claude/{BACKEND}/guides/services-and-repositories.md"
        - ".claude/{BACKEND}/guides/validation-patterns.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      GREEN phase of TDD — implement ONLY the {module} module. Sibling cells are
      implementing other modules in parallel; do not touch their files.

      === v70 SHORT-CIRCUIT — read first ===
      The scaffold-crud-modules + scaffold-auth-module + scaffold-workflow-modules +
      scaffold-upload-modules nodes have ALREADY written this module's files:
      entity / repository / service / controller / module / dtos. Run this check
      BEFORE doing any LLM work:

      1. Read {BACKEND_DIR}/src/modules/{module}/{module}.controller.ts (or the
         scaffold's pluralized equivalent if it differs). Count the @Get/@Post/etc.
         endpoints declared.
      2. Read PROJECT_API.md and count the documented endpoints for {module}.
      3. If counts match AND the controller has no `// TODO` markers AND the
         service's methods all have real bodies (not throw stubs), the module is
         SCAFFOLD-COMPLETE.

      If SCAFFOLD-COMPLETE, IMMEDIATELY write {STATUS_DIR}/BACKEND_IMPLEMENT_{module}.md
      with this exact content and exit (no code changes):

        module: {module}
        phase: green
        status: scaffold-complete
        endpoints_documented: <count from PROJECT_API.md>
        endpoints_implemented: <count from controller>
        note: no LLM implement needed; scaffold-crud-modules produced complete module

      DO NOT modify any files. The merge step downstream treats scaffold-complete
      modules as passing. This saves ~5-10min per pure-CRUD module.

      === If NOT scaffold-complete, continue below ===

      GOAL: make all tests in {BACKEND_DIR}/test/ that target the {module} module pass.

      SCOPE (read carefully):
      - Identify endpoints belonging to {module} by scanning PROJECT_API.md for routes
        whose resource path or controller name matches this module's responsibility
        (cross-reference with PROJECT_KNOWLEDGE.md "System Modules" section).
      - Identify entities under {BACKEND_DIR}/src/modules/{module}/ or matching the
        module's domain in PROJECT_DATABASE.md (likely created by the database phase).
      - Implement files under {BACKEND_DIR}/src/modules/{module}/ following {BACKEND}
        best practices (Controller -> Service -> Repository -> Entity, base classes).

      DELIVERABLES (for {module} ONLY):
      1. {module}.controller.ts with Swagger decorators + JWT auth where required
      2. {module}.service.ts with business logic (extends BaseService)
      3. {module}.module.ts wiring TypeOrmModule.forFeature + providers + exports
      4. dtos/ subfolder with class-validator decorators on every field
      5. Return snake_case → camelCase mapping where applicable (no raw entities)

      CROSS-GENERATION SELF-HEAL:
      If {STATUS_DIR}/MISSING_ENDPOINTS.yaml exists AND lists
      a resource matching {module}, implement those endpoints too. Use suggested_routes
      as the spec. Apply auth guards per scope. If RED tests exist for those endpoints,
      make them pass.

      PRE-INSTALLED FRAMEWORK FILES (READ-ONLY — DO NOT MODIFY OR RECREATE):
      The scaffold-structure node has already copied canonical templates into
      {BACKEND_DIR}/src/. These files are the single source of truth — import
      from them, do not redefine them:
        - core/base/{base.entity,base.repository,base.service,base.controller}.ts + index.ts
        - core/decorators/* (current-user, public, roles, api-swagger, api-response-data) + index.ts
        - core/filters/* (http-exception, all-exceptions) + index.ts
        - core/guards/* (jwt-auth.guard, jwt.strategy, roles.guard) + index.ts
        - core/interceptors/* (transform, logging, set-token, remove-token) + index.ts
        - core/pipes/validation.pipe.ts + index.ts
        - shared/dtos/{pagination,response-payload}.dto.ts + index.ts
        - shared/interfaces/jwt-payload.interface.ts + index.ts
        - infrastructure/token/{token.module,token.service}.ts
        - config/{env-config.service,jwt.config}.ts
      Treat these as immutable. If a base-class signature looks "wrong" — it is not.
      Adapt your code to it. Do NOT rewrite BaseRepository.update etc.

      DO NOT:
      - Modify files in {BACKEND_DIR}/test/ (owned by RED phase)
      - Modify ANY pre-installed framework file listed above. Touch only feature
        modules under {BACKEND_DIR}/src/modules/{module}/.
      - Implement endpoints belonging to other modules — sibling cells own those
      - Run `npx jest` / `npm test` / any test runner in this node. **Verification
        is deferred to the `verify-green` deterministic node** (which runs the
        full suite single-process at the end of the backend phase). v36 evidence:
        running jest inside parallel fanout cells (concurrency=4) trashed
        shared DB state — 10/11 modules reported `tests_passing: 0/N` even
        when the implementation was correct, because sibling cells' setup/
        teardown wiped each other's seed mid-run. Only `payment` (12/12)
        survived because it happened to run last. Stick to `npx tsc --noEmit`
        for local sanity checks; don't run jest.

      RETURN-TYPE CARDINALITY (must match — v43/v45 both died here):
      - `find(...)`, `findAll(...)`, `findBy(...)`           → Promise<Entity[]>   (array)
      - `findOne(...)`, `findOneBy(...)`, `findOneOrFail(...)` → Promise<Entity | null>  (single)
      - `count(...)`                                          → Promise<number>
      - The declared method return type MUST match the underlying query method's
        cardinality. Do NOT cast `Promise<X[]>` to `Promise<X>` to silence the
        compiler (v43 TS2352) and do NOT assign an array to a singular-typed
        slot (v45 TS2740). If your interface says `findActive(): Promise<X>`,
        use `findOne(...)`. If it says `Promise<X[]>`, use `find(...)`.

      REPORT FILE: {STATUS_DIR}/BACKEND_IMPLEMENT_{module}.md
      Required fields (regex-verifiable):
        module: {module}
        controllers_created: <int>
        services_created: <int>
        dto_files_created: <int>
        endpoints_implemented: <int>
        tests_targeting_module: <int>
        tests_passing: deferred       # v37+ — verify-green runs the suite, not implement
        self_healed_resources: <int>   # MISSING_ENDPOINTS.yaml entries implemented for this module

  - id: merge-implement-reports
    type: deterministic
    description: "Aggregate per-module implement reports into BACKEND_IMPLEMENTATION_REPORT.md"
    command: |
      set -e
      STATUS_DIR="{TARGET_DIR}/{STATUS_DIR}"
      OUT="$STATUS_DIR/BACKEND_IMPLEMENTATION_REPORT.md"
      PARTIALS=$(ls "$STATUS_DIR"/BACKEND_IMPLEMENT_*.md 2>/dev/null | sort || true)
      if [ -z "$PARTIALS" ]; then
        echo "FAIL: no per-module implement reports found in $STATUS_DIR"
        exit 1
      fi
      MODULES=0
      TOTAL_CONTROLLERS=0
      TOTAL_SERVICES=0
      TOTAL_DTOS=0
      TOTAL_ENDPOINTS=0
      TOTAL_PASSING=0
      TOTAL_TESTS=0
      TOTAL_HEALED=0
      DEFERRED_COUNT=0
      for f in $PARTIALS; do
        MODULES=$((MODULES + 1))
        C=$(grep -E '^controllers_created:'   "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        S=$(grep -E '^services_created:'      "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        D=$(grep -E '^dto_files_created:'     "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        E=$(grep -E '^endpoints_implemented:' "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        H=$(grep -E '^self_healed_resources:' "$f" | grep -oE '[0-9]+' | head -1 || echo 0)
        # v37+: per-module reports may say `tests_passing: deferred` because
        # implement no longer runs jest (verify-green does, single-process).
        # Track count of deferred vs numeric for the summary line.
        TP_RAW=$(grep -E '^tests_passing:' "$f" | head -1 | sed 's/^tests_passing:[[:space:]]*//')
        if echo "$TP_RAW" | grep -qE '^deferred'; then
          DEFERRED_COUNT=$((DEFERRED_COUNT + 1))
          P=0; T=0
        else
          TP=$(echo "$TP_RAW" | grep -oE '[0-9]+/[0-9]+' | head -1 || echo "0/0")
          P=$(echo "$TP" | cut -d/ -f1)
          T=$(echo "$TP" | cut -d/ -f2)
        fi
        TOTAL_CONTROLLERS=$((TOTAL_CONTROLLERS + C))
        TOTAL_SERVICES=$((TOTAL_SERVICES + S))
        TOTAL_DTOS=$((TOTAL_DTOS + D))
        TOTAL_ENDPOINTS=$((TOTAL_ENDPOINTS + E))
        TOTAL_HEALED=$((TOTAL_HEALED + H))
        TOTAL_PASSING=$((TOTAL_PASSING + P))
        TOTAL_TESTS=$((TOTAL_TESTS + T))
      done
      {
        echo "# Backend Implementation Report"
        echo ""
        echo "phase: backend-green"
        echo "modules_implemented: $MODULES"
        echo "controllers_created: $TOTAL_CONTROLLERS"
        echo "services_created: $TOTAL_SERVICES"
        echo "dto_files_created: $TOTAL_DTOS"
        echo "endpoints_implemented: $TOTAL_ENDPOINTS"
        if [ "$DEFERRED_COUNT" -eq "$MODULES" ] && [ "$MODULES" -gt 0 ]; then
          echo "tests_passing: deferred ($MODULES modules — verify-green runs the suite)"
        else
          echo "tests_passing: $TOTAL_PASSING/$TOTAL_TESTS"
        fi
        echo "self_healed_resources: $TOTAL_HEALED"
        echo ""
        echo "## Per-module reports"
        echo ""
        for f in $PARTIALS; do
          echo "### $(basename $f)"
          echo ""
          cat "$f"
          echo ""
        done
      } > "$OUT"
      echo "aggregated $MODULES module reports -> $OUT"
    on_failure: abort
    abort_message: "Cannot aggregate per-module reports. Check that per-module fanout cells produced their BACKEND_IMPLEMENT_<module>.md files."

  - id: normalize-implement-reports
    type: deterministic
    description: "Substitute placeholders + inject YAML-pair duplicates for markdown-table rows in BACKEND_IMPLEMENT_*.md + BACKEND_IMPLEMENTATION_REPORT.md (model-agnostic backstop)"
    command: |
      # Same protection as normalize-backend-tests-report but for the
      # implement fanout's per-module reports + the merged aggregate.
      # Catches `module:` / `controllers_created:` / `tests_passing:` etc.
      # if the model wrote them as markdown table cells instead of YAML lines.
      # Loop because file count varies per project (12 modules typical).
      for f in {TARGET_DIR}/{STATUS_DIR}/BACKEND_IMPLEMENT_*.md \
               {TARGET_DIR}/{STATUS_DIR}/BACKEND_IMPLEMENTATION_REPORT.md; do
        [ -f "$f" ] && node {CLAUDE_DIR}/v2/scripts/normalize-docs.js {project} "$f" >/dev/null || true
      done
      echo "normalized implement reports under {STATUS_DIR}/"
    on_failure: ignore

  - id: normalize-modules
    type: deterministic
    description: "Deterministic post-implement normalizer — fix common structural drift before typecheck (model-agnostic)"
    command: |
      # Three model-agnostic fixes (see .claude/v2/scripts/normalize-modules.js):
      #   1. Rewrite wrong import depth for core/base, shared, infrastructure, etc.
      #   2. Insert missing `import { XxxRepository } from './xxx.repository'`
      #      in <feature>.service.ts when the class is referenced but not imported.
      #   3. Prune `./modules/X/X.module` imports from app.module.ts when the
      #      module file doesn't exist on disk — this is the model-agnostic
      #      version of v38's intended "wire-app-module POST-fanout" fix.
      # Idempotent — safe to re-run.
      node {CLAUDE_DIR}/v2/scripts/normalize-modules.js {TARGET_DIR}/{BACKEND_DIR}/src
    on_failure: ignore

  # v78: normalize findAll overrides returning Entity[] to the canonical
  # `{ items, total, page, limit, totalPages }` paginated shape. Idempotent.
  - id: scaffold-pagination-meta
    type: deterministic
    description: "v78: normalize service.findAll return shape to canonical pagination"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-pagination-meta.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  - id: lint-fix
    type: deterministic
    description: "Auto-fix ESLint issues"
    command: "cd {TARGET_DIR}/{BACKEND_DIR} && npx eslint src/ --fix 2>&1 || true"
    on_failure: ignore

  # v63: AppModule registration. Scans src/modules/*/<name>.module.ts and emits
  # canonical app.module.ts with all of them imported. Preserves custom regions
  # between NORMALIZE_KEEP_TOP/BOTTOM marker comments. v62-att2 evidence: neither
  # scaffold-crud-modules nor LLM-implement-fanout updates app.module.ts, so
  # AppModule was missing or stale → typecheck cliff.
  - id: normalize-app-module
    type: deterministic
    description: "Regenerate app.module.ts from on-disk module files"
    command: |
      node {CLAUDE_DIR}/v2/scripts/normalize-app-module.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  # v65: strip LLM-generated BaseController method overrides whose return type
  # mismatches the parent class. v64 evidence: SystemSettingController and
  # 3 others overrode findAll/findOne with Promise<{data:T}> instead of
  # Promise<T[]>/Promise<T> → TS2416 across all of them. The override is
  # almost always unnecessary (LLM was just wrapping in {data}); removing it
  # lets the inherited BaseController method respond correctly.
  - id: normalize-base-controller-overrides
    type: deterministic
    description: "Strip incorrect BaseController.findAll/findOne/etc overrides"
    command: |
      node {CLAUDE_DIR}/v2/scripts/normalize-base-controller-overrides.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  # v82: ensure every declared dep is actually installed before tests run.
  # v81 evidence: bcrypt was in package.json (^5.1.1) but not in node_modules
  # → e2e tests failed with `Cannot find module 'bcrypt'` → route_to_agent
  # looped 95min trying to fix what `npm install` does in 30sec. Several
  # scaffolds (scaffold-seed-script, scaffold-toast-system, etc.) add deps
  # but the baseline tar's pre-installed node_modules is stale.
  - id: scaffold-ensure-deps-installed
    type: deterministic
    description: "v82: npm install if any package.json dep is missing from node_modules"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-ensure-deps-installed.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}"
    on_failure: ignore

  # v82: add missing enum imports to test files (DocumentStatusEnum,
  # NotificationTypeEnum, etc.). v79+v80 evidence: LLM generate-tests
  # fanout writes per-controller test files referencing domain enums
  # without importing them → TS2304 cascade.
  - id: scaffold-test-enum-imports
    type: deterministic
    description: "v82: add missing *Enum imports to backend test files (catches LLM generate-tests gaps)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-test-enum-imports.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --side backend \
        --verbose
    on_failure: ignore

  # v85: derive DTO-compliant fixture data for every Create*Dto.
  # Direct response to the Claude replay finding: tests that POST to
  # /api/X get 400 Bad Request because the inline test data doesn't
  # satisfy the DTO's class-validator constraints. This scaffold reads
  # each Create*Dto, generates valid sample data per validator
  # (@IsEmail → email string, @IsEnum(X) → Object.values(X)[0],
  # @MinLength(N) → string of N+ chars, etc.), and emits
  # test/fixtures/<entity>-create.fixture.ts exporting
  # `validCreateXPayload()` for tests to call.
  - id: scaffold-test-fixtures-from-dto
    type: deterministic
    description: "v85: emit DTO-compliant test fixture payloads from class-validator decorators"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-test-fixtures-from-dto.js \
        --backend-dir "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v90: DISABLED v91 — scaffold-truncated-llm-doctor's brace-balance parser
  # doesn't handle template literals `${...}` and other TS constructs
  # correctly. Dry-run against v88 snapshot quarantined 78 valid files
  # (21 backend + 57 frontend). Better strategy: let typecheck fail and
  # route_to_agent (Claude fix-agent already handles truncation correctly).
  # When we rewrite this scaffold to use the real TypeScript parser, re-wire.
  # - id: scaffold-truncated-llm-doctor (disabled v91)

  # v90: emit initial TypeORM migration so the schema can deploy without
  # synchronize:true. v87-v89 database evaluator flagged "migrations dir
  # empty" every run (-0.15 on score). Falls back to a STUB migration if
  # `typeorm migration:generate` can't run (e.g. data-source.ts missing
  # or entities don't compile yet).
  - id: scaffold-initial-migration
    type: deterministic
    description: "v90: emit initial migration via typeorm migration:generate (or stub fallback)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-initial-migration.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v97: Module-import-doctor catches TS2307 'Cannot find module' errors
  # caused by LLM-emitted module.ts files referencing controllers/dtos/etc.
  # that don't exist yet (race between scaffold-crud-module emission and
  # implement-fanout LLM rewrites). v96 evidence: notification.module.ts +
  # dashboard.module.ts imported files that existed only AFTER backend
  # phase ended → typecheck failed at the wrong moment → cascade.
  # Walks *.module.ts, drops imports for non-resolving relative paths,
  # scrubs the corresponding symbols from @Module decorator lists.
  # v96: Defensive parse-error sweep. Walks every src/**/*.ts (skipping
  # entities, .d.ts, .spec.ts), parses with the project's TypeScript
  # compiler API, deletes any file that fails to parse. v95 evidence:
  # system-setting.controller.ts had parse errors → backend phase ended ⚠️.
  - id: scaffold-ts-balance-doctor
    type: deterministic
    description: "v96: delete unparseable backend .ts files so scaffolds re-emit clean versions before typecheck"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-ts-balance-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v97 (re-ordered v98): Module-import-doctor MUST run AFTER ts-balance-
  # doctor — the latter DELETES files with parse errors, leaving module
  # imports dangling. v97 evidence: document.controller.ts had parse
  # errors → ts-doctor deleted it → document.module.ts still imported it
  # → typecheck TS2307. Running module-import-doctor SECOND scrubs the
  # now-broken imports so typecheck passes.
  # Walks *.module.ts, drops imports for non-resolving relative paths,
  # scrubs the corresponding symbols from @Module decorator lists.
  - id: scaffold-module-import-doctor
    type: deterministic
    description: "v98: drop broken relative imports from *.module.ts (runs AFTER ts-doctor deletions)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-module-import-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # v114: reorder nested DTO classes so a class is declared AFTER every same-file
  # class it references. emitDecoratorMetadata evaluates `design:type` at decoration
  # time, so a forward class reference throws a TDZ ReferenceError ("Cannot access
  # 'X' before initialization") at module load — which `tsc --noEmit` does NOT catch
  # (it passes clean). v107: dashboard-query.dto.ts had DashboardGroupDto before the
  # DashboardWindowDto it references → app.module load threw → 6/8 e2e suites failed
  # to run → backend Failed at verify-green → whole-pipeline cascade. The run burned
  # its single route_to_agent retry on this and still aborted. Deterministic now.
  - id: scaffold-dto-class-order-doctor
    type: deterministic
    description: "v114: topologically reorder intra-file DTO classes (fix emitDecoratorMetadata TDZ ReferenceError that tsc can't see)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-dto-class-order-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: typecheck
    type: deterministic
    description: "Verify backend compiles"
    command: |
      cd {TARGET_DIR}/{BACKEND_DIR} && \
      npx tsc --noEmit 2>&1
    # v100: dropped the `tsc --project tsconfig.app.json || tsc --noEmit`
    # fallback. tsconfig.app.json doesn't ship in the backend template, so
    # the first command always failed with TS5058 even when there were no
    # real errors. The TS5058 leaked into fix-agent's regression-counter
    # (counted alongside real errors), and combined with the orchestrator's
    # broken validation command (also v100-fixed) caused false bails.
    # v65: route_to_agent so fix-agent gets 3 attempts to patch typecheck
    # errors instead of cold-aborting the backend phase. Pairs with the
    # v63 normalizers (frontend-imports, base-controller-overrides) which
    # handle the most common patterns deterministically; route_to_agent
    # picks up the long tail (e.g. cross-file name drift, missing imports
    # the normalizer didn't recognize). v59 fix-agent CWD propagation
    # makes this productive.
    on_failure: route_to_agent
    abort_message: "Backend TypeScript does not compile — GREEN phase produced broken code"

  - id: verify-green
    type: deterministic
    description: "Run tests to confirm GREEN state"
    command: |
      cd {TARGET_DIR}/{BACKEND_DIR}
      if [ -f tsconfig.spec.json ]; then
        npx tsc --project tsconfig.spec.json --noEmit 2>&1 || { echo "FAIL: test files do not compile"; exit 1; }
      fi
      npx jest --passWithNoTests 2>&1
    # v55 fix: was on_failure: abort — v54 evidence verify-green failed (17
    # suite compile errors + 3 logic test failures) and backend phase died
    # cold, leaving frontend/integrate/test-api/test-browser to cascade fail
    # on broken backend. route_to_agent gives the LLM 3 attempts to fix the
    # GREEN tests (compile errors in test files, NaN/string-vs-number DTO
    # bugs) — same pattern as test-api's run-backend-tests retry loop.
    on_failure: route_to_agent
    abort_message: "Tests still failing after GREEN implementation"

  # v104: re-run idempotent scaffolds to restore scaffold-protected files
  # that fix-agent may have edited during typecheck/verify-green repair.
  # v104 evidence: fix-agent edited LoginDto to make email + password
  # @IsOptional, making verify-green pass but breaking POST /auth/login
  # at runtime — every downstream story (84 of 84) failed with HTTP 400.
  # Each scaffold respects its own "Generated by scaffold-X" marker so
  # LLM-authored e2e specs and pages are untouched. Per template_wins_LLM.
  - id: scaffold-restorer
    type: deterministic
    description: "v104: restore scaffold-protected files that fix-agent may have edited"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-restorer.js \
        --target "{TARGET_DIR}" \
        --phase backend \
        --spec "{TARGET_DIR}/{STATUS_DIR}/MODULE_PLAN.yaml" \
        --backend-dir "{TARGET_DIR}/{BACKEND_DIR}" \
        --claude-dir "{CLAUDE_DIR}" \
        --verbose
    on_failure: ignore

  # ============================================================================
  # PHASE 5c — REFACTOR
  # ============================================================================

  - id: refactor
    type: agentic
    description: "REFACTOR — improve code quality while keeping tests green"
    on_failure: ignore  # v83: optional polish — skip if mimo MAX_TURNS, downstream review/seed-check don't depend on it
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/BACKEND_REFACTOR_REPORT.md"
    verification_pattern: "refactor_status:\\s*(complete|skipped)"
    scope_guard:
      allow: ["{BACKEND_DIR}/src/**"]
      deny: ["{BACKEND_DIR}/test/**"]
    context:
      additional_read:
        - ".claude/{BACKEND}/guides/best-practices.md"
    tool_profile:
      allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      REFACTOR phase. Review {BACKEND_DIR}/src/ for:
      - Code duplication (extract to shared utilities)
      - Missing Swagger decorators (@ApiTags, @ApiOperation, @ApiResponse)
      - Missing class-validator decorators on DTOs
      - Inconsistent naming vs {BACKEND} conventions
      - Proper use of HTTP status codes

      Improve clarity without changing behavior. Tests MUST still pass.
      Do NOT modify {BACKEND_DIR}/test/.

      REPORT FILE: {STATUS_DIR}/BACKEND_REFACTOR_REPORT.md
      Required fields:
        phase: backend-refactor
        refactor_status: (complete|skipped)
        changes_made: <int>
        files_touched: [list]
        tests_still_passing: (true|false)

  # ============================================================================
  # REVIEW — spec compliance
  # ============================================================================

  - id: review
    type: agentic
    description: "REVIEW — verify implementation matches PROJECT_API.md"
    on_failure: ignore  # v83: optional QA pass — downstream evaluator + ship don't depend on this report
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/BACKEND_REVIEW_REPORT.md"
    verification_pattern: "spec_compliance:\\s*[0-9.]+"
    scope_guard:
      allow: ["{BACKEND_DIR}/src/**"]
      deny: ["{BACKEND_DIR}/test/**"]
    context:
      additional_read:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_DATABASE.md"
    tool_profile:
      allow: [Read, Write, Edit, Bash, Grep, Glob]
      deny: [WebSearch, WebFetch]
    prompt: |
      Review the backend implementation against PROJECT_API.md.

      CHECK:
      1. Every PRD endpoint has a controller route
      2. Request/response DTOs match documented shapes
      3. HTTP status codes correct (201 create, 204 delete, etc.)
      4. Auth guards applied as documented
      5. Error responses handled (400 / 401 / 403 / 404)
      6. No over-engineering — features not in spec should be removed

      REPORT FILE: {STATUS_DIR}/BACKEND_REVIEW_REPORT.md
      Required fields:
        phase: backend-review
        spec_compliance: <float 0.0-1.0>
        missing_endpoints: [list]
        extra_endpoints: [list]
        dto_mismatches: [list]
        issues_fixed: <int>
        status: (PASS|NEEDS_WORK)

      If spec_compliance < 0.9, fix the critical issues before writing the report.

  # ============================================================================
  # FINAL SAFETY-DOCTOR PASS (deterministic) — v118
  # ============================================================================
  # The rolesguard-coerce + jwt-role-nullish doctors above run PRE-implement
  # (node ~23). But `implement`, `refactor`, and `review` are all LLM nodes that
  # rewrite {BACKEND_DIR}/src/** AFTER them. v118 evidence: auth.service.ts:108
  # came back as `role: u.role || 'user'` (falsy-zero P0, RULE-B8) — the
  # pre-implement doctor fixed the scaffolded auth module, then implement/review
  # reintroduced the bug, and the doctor never re-ran. Re-run the idempotent,
  # typecheck-safe safety doctors HERE as the last src mutation, so no LLM node
  # can clobber them before the gate/evaluator reads the code. (Doctors are
  # marker-idempotent; a no-op pass costs ~ms when nothing reintroduced the bug.)
  - id: scaffold-rolesguard-coerce-doctor-final
    type: deterministic
    description: "v118: re-run RolesGuard number↔name reconcile AFTER all LLM src nodes (implement/refactor/review clobber the pre-implement pass)"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-rolesguard-coerce-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: scaffold-jwt-role-nullish-doctor-final
    type: deterministic
    description: "v118: re-run falsy-zero role fix (role: x.role || 'user' → ??) AFTER implement/refactor/review — RULE-B8 P0 reappeared post-doctor in v118"
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-jwt-role-nullish-doctor.js \
        --target "{TARGET_DIR}/{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  - id: scaffold-owner-stamp-doctor-final
    type: deterministic
    description: "v128: stamp owner FK (worker_id/user_id/actor_id/created_by) from @CurrentUser on owned-resource create() — AFTER implement/refactor/review (which clobber an earlier pass). v127: 50 not-null e2e failures from BaseController.create persisting a DTO whose owner FK was never supplied."
    command: |
      node {CLAUDE_DIR}/v2/scripts/scaffold-owner-stamp-doctor.js \
        --target "{TARGET_DIR}" \
        --backend-dir "{BACKEND_DIR}" \
        --verbose
    on_failure: ignore

  # ============================================================================
  # TIER 3: EVIDENCE CHECK (deterministic)
  # ============================================================================

  - id: seed-script-check
    type: deterministic
    description: "Verify seed script exists and is registered in package.json (RULE-B3)"
    command: |
      SEED="{TARGET_DIR}/{BACKEND_DIR}/src/database/seed.ts"
      [ -f "$SEED" ] || { echo "FAIL: seed script missing at $SEED"; exit 1; }
      grep -q '"seed"' "{TARGET_DIR}/{BACKEND_DIR}/package.json" || { echo "FAIL: seed script not registered in package.json"; exit 1; }
      echo "PASS: seed script exists and registered"
    on_failure: route_to_agent
    route_to_agent_attempts: 2
    fix_context: |
      RULE-B3 requires a seed script at {BACKEND_DIR}/src/database/seed.ts.
      It must read fixture users from {PROJECT_DIR}/user_stories/_fixtures.yaml.
      It must be registered in package.json scripts as "seed".
      See .claude/rules/phases/backend.rules.md for full requirements.

  - id: evidence-check
    type: deterministic
    description: "Verify backend phase produced controllers, services, and tests"
    command: |
      CTRL=$(find {TARGET_DIR}/{BACKEND_DIR}/src -name '*.controller.ts' 2>/dev/null | wc -l | tr -d ' ')
      SVC=$(find {TARGET_DIR}/{BACKEND_DIR}/src -name '*.service.ts' 2>/dev/null | wc -l | tr -d ' ')
      TEST=$(find {TARGET_DIR}/{BACKEND_DIR}/test -name '*.e2e-spec.ts' -o -name '*.spec.ts' 2>/dev/null | wc -l | tr -d ' ')
      FAIL=0
      [ "$CTRL" -eq 0 ] && echo "FAIL: no controllers" && FAIL=1
      [ "$SVC" -eq 0 ] && echo "FAIL: no services" && FAIL=1
      [ "$TEST" -eq 0 ] && echo "FAIL: no tests" && FAIL=1
      [ "$FAIL" -eq 1 ] && exit 1
      echo "PASS: $CTRL controllers, $SVC services, $TEST tests"
    on_failure: abort
    abort_message: "Backend phase must produce controllers, services, and tests"

  - id: cross-reference-consistency
    type: deterministic
    description: "Drift check — routes/states/columns vs controllers/services/DTOs (advisory)"
    command: |
      bash "{CLAUDE_DIR}/gates/cross-reference-consistency.sh" "{TARGET_DIR}" "{project}" \
        | tee "{TARGET_DIR}/{STATUS_DIR}/CONSISTENCY_REPORT_BACKEND.json"
      # Advisory at backend-phase: drift after backend is expected (frontend not done yet).
      # Actual fail enforcement happens at integrate phase.
      exit 0
    on_failure: ignore

  # ============================================================================
  # TIER 4: LLM EVALUATOR (article §2 — separate generator from evaluator)
  # ============================================================================
  #
  # Independent grading of API design, business-logic depth, error
  # specificity, and test meaningfulness — none of which the deterministic
  # gates catch. Particularly catches the case where the existing `review`
  # agentic node above grades its own implementation favorably.

  - id: backend-evaluator
    type: evaluator
    description: "Grade API design, business-logic depth, error specificity, test coverage"
    rubric_file: ".claude/blueprints/evaluators/backend-rubric.yaml"
    required_output_file: "{TARGET_DIR}/{STATUS_DIR}/backend-evaluation.json"
    verification_pattern: '"overall_score"\s*:\s*[0-9.]+'
    tool_profile:
      allow: [Read, Grep, Glob, Bash, Write]
      deny: [Edit, NotebookEdit, WebFetch, WebSearch]
    inputs:
      artifacts:
        - "{TARGET_DIR}/{BACKEND_DIR}/src/modules/**/*.controller.ts"
        - "{TARGET_DIR}/{BACKEND_DIR}/src/modules/**/*.service.ts"
        # NestJS rules prefer `dtos/` plural but real projects often use
        # `dto/`. Match both via the broader **/*.dto.ts.
        - "{TARGET_DIR}/{BACKEND_DIR}/src/modules/**/*.dto.ts"
        - "{TARGET_DIR}/{BACKEND_DIR}/test/**/*.e2e-spec.ts"
      references:
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_API.md"
        - "{TARGET_DIR}/{PROJECT_DIR}/docs/PROJECT_KNOWLEDGE.md"
      max_files: 30
      max_chars_per_file: 8000
    # v118: hard_gate — the evaluator is ADVISORY for the score (gate score =
    # deterministic only, so it's reproducible: same code → same score, no
    # LLM-judge variance). A P0 blocker still force-fails. We moved to this
    # because (a) the soft_score 0.6/0.4 blend made the gate non-reproducible
    # (v118 drift +0.303: det 0.810 vs eval 0.507 on identical code), and
    # (b) the recurring evaluator findings (falsy-zero role, stub controllers,
    # validator coverage) are now promoted to DETERMINISTIC gate checks, so the
    # det score itself measures correctness. The evaluator still runs and writes
    # backend-evaluation.json as an advisory report + P0 veto.
    blend:
      strategy: hard_gate
    calibration:
      examples_file: ".claude/blueprints/evaluators/backend-examples.yaml"
    on_failure: ignore

tool_profile:
  allow: [Read, Write, Edit, MultiEdit, Bash, Grep, Glob]
  deny: [WebSearch, WebFetch]
